<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5c4d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="سجل الديون">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./assets/icon-192.png">
<title>سجل الديون</title>
<style>
  :root{--ink:#1c2321;--mute:#66736f;--line:#d9dfdc;--bg:#f3f5f2;--main:#0f5c4d;--bad:#b3261e;--ok:#166534;--nav-h:64px;--soft:#f6f8f7}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;font-family:system-ui,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;width:100%;background:#fff;color:var(--ink)}
  textarea{min-height:80px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--main);outline-offset:1px}


  /* ====== الهيكل العام ====== */
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh}

  header{background:var(--main);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:8px;padding-top:calc(10px + env(safe-area-inset-top))}
  header h1{margin:0;font-size:16px;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .who{font-size:12px;opacity:.85;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
  header button{background:rgba(255,255,255,.15);padding:6px 10px;border-radius:8px;font-size:13px;color:#fff;white-space:nowrap}

  main{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px;padding-bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  body.detail main{padding-bottom:20px}

  .screen{display:flex;flex-direction:column;gap:12px}
  .screen.hidden{display:none}


  /* ====== الشريط السفلي ====== */
  #bottom-nav{
    position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);
    padding-bottom:env(safe-area-inset-bottom);
    background:#fff;border-top:1px solid var(--line);
    display:flex;justify-content:space-around;align-items:center;
    z-index:20;box-shadow:0 -2px 8px rgba(0,0,0,.04)
  }
  #bottom-nav.hidden{display:none}
  #bottom-nav button{
    flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:3px;font-size:12px;color:var(--mute);padding:6px 2px;-webkit-tap-highlight-color:transparent
  }
  #bottom-nav button .ico{width:58px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:15px;transition:background .15s}
  #bottom-nav button .ico svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  #bottom-nav button.on{color:var(--main);font-weight:700}
  #bottom-nav button.on .ico{background:rgba(15,92,77,.13)}
  #bottom-nav button.on .ico svg{stroke-width:2.2}


  /* ====== بطاقات ====== */
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
  h2{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
  .btn{padding:11px 14px;border-radius:10px;border:1px solid var(--main);background:var(--main);color:#fff;font-weight:600}
  .btn.alt{background:#fff;color:var(--main)}
  .btn.del{background:#fff;color:var(--bad);border-color:var(--bad)}
  .btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
  .btn:disabled{opacity:.5}
  .empty{color:var(--mute);padding:20px;text-align:center;font-size:14px}
  .hint{color:var(--mute);font-size:13px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stack{display:flex;flex-direction:column;gap:10px}
  .filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .customer-picker{position:relative;display:flex;flex-direction:column;gap:5px}
  .customer-picker>label{font-size:13px;color:var(--mute)}
  .customer-options{position:absolute;top:100%;right:0;left:0;z-index:40;max-height:min(42vh,320px);overflow:auto;overscroll-behavior:contain;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 20px rgba(0,0,0,.12)}
  .customer-option{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:11px;border-bottom:1px solid var(--line);text-align:right;background:#fff;cursor:pointer}
  .customer-option:last-child{border-bottom:0}
  .customer-option:hover,.customer-option[aria-selected="true"]{background:var(--soft)}
  .customer-option:focus{outline:2px solid var(--main);outline-offset:-2px}
  .customer-option-name{font-weight:600;color:var(--ink);word-break:break-word}
  .customer-option-debt{font-size:12px;color:var(--mute);white-space:nowrap}
  .customer-option-debt.debt{color:var(--bad)}
  #invoice-modal{position:fixed;inset:0;background:rgba(0,0,0,.58);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
  #invoice-modal.hidden{display:none}
  #invoice-modal .card{width:min(430px,100%);max-height:90vh;overflow:auto;margin:0}
  #invoice-modal .modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
  #invoice-modal .invoice-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0;color:var(--mute);font-size:14px}
  label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mute)}


  /* ====== KPI ====== */
  .kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kpi>div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12px;color:var(--mute)}
  .kpi b{display:block;font-size:20px;color:var(--ink);margin-top:6px;font-weight:800}
  .kpi b.debt{color:var(--bad)}
  .kpi b.ok{color:var(--ok)}
  .kpi>div.wide{grid-column:1/-1}


  /* ====== قائمة العملاء ====== */
  .customer-search-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
  .customer-search-head label{display:block;margin:0}
  .customer-sort-toggle{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:32px;padding:5px 9px;border:1px solid var(--line);border-radius:999px;background:var(--soft);color:var(--main);font-size:12px;font-weight:700;white-space:nowrap}
  .customer-sort-toggle:focus-visible{outline:2px solid var(--main);outline-offset:2px}
  .customer-sort-toggle[aria-pressed="true"]{border-color:var(--main);background:rgba(15,92,77,.1)}
  .cust-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:transform .1s}
  .cust-card:active{transform:scale(.99)}
  .cust-card .top-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .cust-card .cname{font-size:16px;font-weight:700;word-break:break-word;flex:1}
  .cust-card .cdebt{font-size:17px;font-weight:700;white-space:nowrap}
  .cust-card .cdebt.debt{color:var(--bad)}
  .cust-card .cdebt.ok{color:var(--ok)}
  .cust-card .meta{font-size:12px;color:var(--mute)}
  .cust-card .arrow{color:var(--mute);font-size:20px;line-height:1}


  /* ====== ملف العميل ====== */
  .profile-head{background:linear-gradient(135deg,var(--main) 0%,#0a3f34 100%);color:#fff;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
  .profile-head .pname{font-size:22px;font-weight:800;word-break:break-word}
  .profile-head .pbal{font-size:32px;font-weight:900;line-height:1}
  .profile-head .pmeta{font-size:13px;opacity:.9}
  .profile-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
  .profile-actions .btn{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3);color:#fff}
  .profile-actions .btn:hover{background:rgba(255,255,255,.25)}


  /* ====== بطاقات الحركات ====== */
  .tx-list{display:flex;flex-direction:column;gap:8px}
  .tx{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;background:#fff;border-right-width:4px}
  .tx.inv{border-right-color:var(--bad)}
  .tx.pay{border-right-color:var(--ok);background:#f6fdf9}
  .tx.out,.tx.settlement{border-right-color:var(--ok);background:#f4fff8}
  .tx.void{opacity:.55;background:#f6f6f6;border-right-color:#999}
  .tx.edited{background:#fff8ed;border-right-color:#e98b18}
  #invoice-modal .card.edited{border-color:#e98b18;background:#fff8ed!important}
  .tx .t1{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14px}
  .tx .t2{display:flex;justify-content:space-between;color:var(--mute);font-size:12px}
  .tx .note{font-size:13px;background:#f8fafc;padding:6px 8px;border-radius:6px;white-space:pre-wrap;word-break:break-word}
  .tx .run{font-size:12px;color:var(--mute);border-top:1px dashed var(--line);padding-top:6px;display:flex;justify-content:space-between}
  .tx .run b{color:var(--ink)}
  .tx .actions{display:flex;gap:6px;flex-wrap:wrap;padding-top:4px}
  .tx .tag{font-size:11px;border:1px solid var(--line);border-radius:20px;padding:1px 7px;color:var(--mute)}


  /* ====== شاشة الدخول — مستوحاة من التصميم المرفق، بألوان المتجر ====== */
  #login{position:fixed;inset:0;background:linear-gradient(145deg,#071b22 0%,#0f5c4d 100%);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
  #login .card{width:min(400px,100%);margin:0;padding:40px;background:rgba(0,0,0,.48);border:1px solid rgba(102,219,185,.2);box-shadow:0 15px 25px rgba(0,0,0,.45);border-radius:10px}
  #login h2{margin:0 0 30px;padding:0;color:#fff;text-align:center;font-size:22px}
  #login label{position:relative;color:#fff;display:block;margin:0 0 28px}
  #login label[style]{margin-top:0!important}
  #login input{width:100%;padding:10px 0;font-size:16px;color:#fff;margin-top:5px;margin-bottom:0;border:none;border-bottom:1px solid rgba(255,255,255,.75);outline:none;background:transparent;border-radius:0}
  #login input:focus{outline:none;border-bottom-color:#66dbb9;box-shadow:0 1px 0 #66dbb9}
  #login #btn-login{position:relative;display:block;width:100%;padding:12px 20px;margin-top:8px;background:transparent;color:#66dbb9;border:1px solid #66dbb9;border-radius:5px;letter-spacing:2px;transition:.25s;box-shadow:0 0 8px rgba(102,219,185,.18)}
  #login #btn-login:hover,#login #btn-login:focus{background:#66dbb9;color:#06251e;box-shadow:0 0 8px #66dbb9,0 0 24px rgba(102,219,185,.65);outline:none}


  /* ====== التنبيه ====== */
  #toast{position:fixed;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:11px 20px;border-radius:10px;color:#fff;display:none;z-index:60;max-width:calc(100% - 32px);text-align:center;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
  body.detail #toast{bottom:calc(16px + env(safe-area-inset-bottom))}
  #toast.ok{background:var(--ok);display:block}
  #toast.err{background:var(--bad);display:block}
  .hidden{display:none!important}

  /* ====== معاينة وحفظ المستندات كصور ====== */
  #img-modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.62);display:flex;justify-content:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  #img-modal.hidden{display:none}
  #img-modal .img-shell{width:100%;height:100%;max-width:760px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
  #img-modal .img-toolbar{padding:10px;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.06)}
  #img-modal .img-toolbar-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  #img-modal .img-toolbar-head strong{color:var(--main);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #img-modal .img-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  #img-modal .img-actions.single{grid-template-columns:1fr}
  #img-modal .img-actions .btn{padding:9px 12px}
  #img-wa{display:flex;align-items:center;justify-content:center;gap:7px;background:var(--main);border-color:var(--main);color:#fff}
  #img-wa svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  #img-wa-help{margin:8px 2px 0;line-height:1.45}
  #img-list{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .img-page{width:100%;max-width:520px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .img-page img{display:block;width:100%;height:auto;background:#fff}
  .img-page-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;background:var(--soft);color:var(--mute);font-size:12px}
</style>
</head>
<body>


<div id="login"><div class="card">
  <h2>تسجيل الدخول</h2>
  <label>اسم المستخدم<input id="username" autocomplete="username"></label>
  <label style="margin-top:10px">كلمة المرور<input id="pass" type="password" autocomplete="current-password"></label>
  <button id="btn-login" class="btn" style="width:100%;margin-top:14px">دخول</button>
</div></div>


<div id="app" class="hidden">
  <header>
    <button id="btn-back" class="hidden">→</button>
    <h1 id="screen-title">الإحصائيات</h1>
    <span class="who" id="me"></span>
    <button id="btn-out">خروج</button>
  </header>


  <main>
    <!-- ==== شاشة 1: الإحصائيات ==== -->
    <section id="screen-stats" class="screen">
      <div class="kpi" id="kpi"></div>
      <div class="card hidden" id="push-settings">
        <h2>إشعارات المدير</h2>
        <div class="row2" style="align-items:center">
          <div class="hint" id="push-status" aria-live="polite">إشعارات المتجر اختيارية لهذا الجهاز.</div>
          <button id="btn-push-toggle" class="btn alt sm" type="button">تفعيل الإشعارات</button>
        </div>
      </div>
      <div class="card">
        <h2>آخر الحركات</h2>
        <div class="filters">
          <label>العميل<select id="feed-customer"><option value="">كل العملاء</option></select></label>
          <label>النوع<select id="feed-type">
            <option value="">كل الحركات</option>
            <option value="invoice">فواتير فقط</option>
            <option value="disbursement">فواتير سداد فقط</option>
            <option value="payment">تسديدات فقط</option>
          </select></label>
          <label>الفترة<select id="feed-days">
            <option value="0">الكل</option><option value="1">اليوم</option>
            <option value="7">آخر 7 أيام</option><option value="30">آخر 30 يوم</option>
            <option value="90">آخر 90 يوم</option>
          </select></label>
          <label>تاريخ محدد<input id="feed-date" type="date"></label>
        </div>
        <div class="hint" id="feed-summary"></div>
        <div class="tx-list" id="recent-tx"></div>
      </div>
      <div class="card">
        <h2>أكثر المدينين</h2>
        <div class="tx-list" id="top-debtors"></div>
      </div>
    </section>


    <!-- ==== شاشة 2: فاتورة جديدة ==== -->
    <section id="screen-new" class="screen hidden">
      <div class="card">
  <h2>فاتورة جديدة</h2>
        <div class="stack">
          <label>نوع الفاتورة<select id="inv-kind"><option value="invoice">فاتورة دين</option><option value="disbursement">فاتورة سداد</option></select></label>
          <div class="customer-picker" id="invoice-customer-picker">
            <label for="inv-customer-search">العميل</label>
            <input id="inv-customer-search" type="search" placeholder="ابحث باسم العميل أو رقمه" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="inv-customer-options">
            <input id="inv-customer" type="hidden" value="">
            <div id="inv-customer-options" class="customer-options hidden" role="listbox" aria-label="نتائج العملاء"></div>
          </div>
          <div class="hint" id="cust-hint"></div>
          <label>القيمة<input id="inv-amount" type="number" min="0" step="any" inputmode="decimal" placeholder="0.00"></label>
          <label>المشتريات / البيان<textarea id="inv-note" placeholder="مثال: 2 كيس سكر، 1 زيت"></textarea></label>
          <button id="btn-save" class="btn" style="padding:14px;font-size:16px">حفظ الفاتورة</button>
        </div>
      </div>
      <div class="card">
        <h2>إضافة عميل سريع</h2>
        <div class="stack">
          <label>الاسم<input id="c-name"></label>
          <label id="credit-limit-field">حد الائتمان (0 = بلا حد)<input id="c-limit" type="number" min="0" step="any" value="0" inputmode="decimal"></label>
          <button id="btn-add-c" class="btn alt">إضافة العميل</button>
        </div>
      </div>
    </section>


    <!-- ==== شاشة 3: العملاء ==== -->
    <section id="screen-customers" class="screen hidden">
      <div class="card" style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:14px">إجمالي الديون</span>
        <b id="total-debt" style="font-size:18px;color:var(--bad)">0.00</b>
      </div>
      <div class="card">
        <div class="customer-search-head">
          <label for="customer-search">بحث عن عميل</label>
          <button id="customer-sort" class="customer-sort-toggle" type="button" data-mode="number" aria-pressed="false" aria-label="الترتيب الحالي: الرقم التسلسلي. اضغط للتبديل إلى أعلى رصيد دين">
            <span aria-hidden="true">↕</span><span id="customer-sort-label">الرقم</span>
          </button>
        </div>
        <input id="customer-search" type="search" placeholder="ابحث باسم العميل أو رقمه" autocomplete="off" aria-label="بحث عن عميل">
      </div>
      <div class="cust-list stack" id="customers"></div>
    </section>


    <!-- ==== شاشة 4: ملف العميل ==== -->
    <section id="screen-customer" class="screen hidden">
      <div class="profile-head" id="profile-head"></div>
      <div class="card">
        <h2>كشف الحركات</h2>
        <div class="tx-list" id="customer-tx"></div>
      </div>
    </section>


    <!-- ==== شاشة 5: المستخدمون ==== -->
    <section id="screen-users" class="screen hidden">
      <div class="card">
        <h2 id="user-form-title">إضافة مستخدم</h2>
        <div class="stack">
          <label>اسم المستخدم<input id="u-username" autocomplete="off"></label>
          <label>الاسم الظاهر<input id="u-name"></label>
          <label>الدور<select id="u-role"><option value="seller">بائع</option><option value="admin">مدير</option></select></label>
          <label>كلمة المرور<input id="u-password" type="password" autocomplete="new-password" placeholder="6 أحرف على الأقل"></label>
          <button id="btn-save-user" class="btn">إضافة المستخدم</button>
          <button id="btn-cancel-user" class="btn alt hidden">إلغاء التعديل</button>
        </div>
      </div>
      <div class="card">
        <h2>المستخدمون</h2>
        <div class="tx-list" id="users"></div>
      </div>
    </section>
  </main>


  <nav id="bottom-nav">
    <button data-screen="stats" class="on"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-8M12 20V5M19 20v-5"/></svg></span>الإحصائيات</button>
    <button data-screen="new"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 11v6M9 14h6"/></svg></span>فاتورة</button>
    <button data-screen="customers"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17.5 14.2c2.4.3 4 2.1 4 4.8"/></svg></span>العملاء</button>
    <button data-screen="users" id="nav-users" class="hidden"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></svg></span>المستخدمون</button>
  </nav>
</div>

async function refreshPushSettings(){
  if (pushBusy) return;
  const card = $('#push-settings'), button = $('#btn-push-toggle'), status = $('#push-status');

    button.disabled = true;

  if (Notification.permission === 'denied'){
    status.textContent = 'إذن الإشعارات مرفوض. غيّر الإذن من إعدادات المتصفح لهذا الموقع.';

  try {

    const subscription = await registration.pushManager.getSubscription();
    if (!subscription){

      if (rpcError) throw rpcError;
      const { data, error } = await sb.functions.invoke('push-notify', { body: { action: 'public_key' } });
      if (error || !data?.publicKey) throw new Error('خدمة الإشعارات غير مهيأة على الخادم');

      button.textContent = 'تفعيل الإشعارات';

    if (error) throw error;
    status.textContent = active ? 'هذا الجهاز مسجّل لاستقبال إشعارات المدير.' : 'يوجد اشتراك محلي غير مربوط بهذا الحساب.';

}
function vapidKeyBytes(base64Url){
  const padding = '='.repeat((4 - base64Url.length % 4) % 4);
  const binary = atob((base64Url + padding).replace(/-/g, '+').replace(/_/g, '/'));
  return Uint8Array.from(binary, char => char.charCodeAt(0));
}
$('#btn-push-toggle').addEventListener('click', async () => {

  try {
    // اطلب الإذن مباشرة من ضغطة المستخدم، قبل أي انتظار شبكي، خصوصًا على iOS.
    if (Notification.permission === 'default'){
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') throw new Error('لم يُمنح إذن الإشعارات');
    }
    if (Notification.permission !== 'granted') throw new Error('إذن الإشعارات غير متاح');
    const registration = await navigator.serviceWorker.ready;
    let subscription = await registration.pushManager.getSubscription();
    if (subscription){
      const { data: active, error: statusError } = await sb.rpc('has_push_subscription', { p_endpoint: subscription.endpoint });
      if (statusError) throw statusError;

        const { error: deleteError } = await sb.rpc('delete_push_subscription', { p_endpoint: subscription.endpoint });

      subscription = await registration.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: vapidKeyBytes(pushVapidPublicKey)
      });
    }

    if (!details.endpoint || !details.keys?.p256dh || !details.keys?.auth) throw new Error('بيانات اشتراك المتصفح غير مكتملة');
    const { error: saveError } = await sb.rpc('save_push_subscription', {
      p_endpoint: details.endpoint,

      p_auth: details.keys.auth

      await subscription.unsubscribe();

    const message = error instanceof Error ? error.message : 'خطأ غير معروف';

    button.textContent = oldLabel;
    await refreshPushSettings();
  }
});

// PostgREST قد يحدّ-rows لكل استجابة، فنقسم على صفحات ونقارن بعدد الصفوف الكلي
const PAGE = 1000;
async function fetchAll(table, cols, customerId){
  const out = []; let from = 0, count = null;
  for (let guard = 0; guard < 1000; guard++){
    const { data, error, count: c } = await sb.from(table)
      .select(cols, { count: 'exact' })
      .eq('customer_id', customerId)
      .order('created_at',{ascending:true}).order('id',{ascending:true})
      .range(from, from + PAGE - 1);
    if (error) throw error;
    if (c != null) count = c;
    out.push(...(data || []));
    from += (data || []).length;
    if (!data || !data.length) break;
    if (count != null ? from >= count : data.length < PAGE) break;
  }
  return { rows: out, complete: count == null || out.length >= count };
}

// ترتيب حتمي: الزمن، ثم الفاتورة قبل التسديد، ثم المعرّف.
// (المعرّفات من جدولين مختلفين فلا يصحّ خلطها في مقارنة واحدة)
function cmpStatement(a, b){
  const t = new Date(a.d) - new Date(b.d);
  if (t) return t;
  if (a.src !== b.src) return a.src === 'inv' ? -1 : 1;
  return (a.id || 0) - (b.id || 0);
}

/* مصدر واحد للحقيقة: يبني حركات العميل مرتّبة، مع الرصيد بعد كل حركة
   والإجماليات والرصيد النهائي. تستخدمه الشاشة والطباعة معاً، فلا تختلفان أبداً. */
function buildStatement(invRows, payRows){
  const rows = [
    ...(invRows || []).map(r => {
      const voided = Boolean(r.voided_at);
      return {
        src: 'inv', id: r.id, d: r.created_at, voided, edited: Boolean(r.edited_at),
        type: voided ? 'void' : (r.kind === 'disbursement' ? 'settlement' : 'inv'),
        title: (r.kind === 'disbursement' ? 'فاتورة سداد' : 'فاتورة دين') + ' #' + r.id + (voided ? ' (ملغاة)' : ''),
        note: voided && r.void_reason
          ? (r.note ? r.note + ' — سبب الإلغاء: ' + r.void_reason : 'سبب الإلغاء: ' + r.void_reason)
          : r.note,
        by: r.profiles?.name,
        debit: voided || r.kind === 'disbursement' ? 0 : Number(r.total) || 0,
        credit: voided || r.kind !== 'disbursement' ? 0 : Number(r.total) || 0
      };
    }),
    ...(payRows || []).map(r => ({
      src: 'pay', id: r.id, d: r.created_at, voided: Boolean(r.voided_at), edited: Boolean(r.edited_at),
      type: r.voided_at ? 'void' : 'pay',
      title: 'إيصال قبض #' + r.id + (r.voided_at ? ' (ملغى)' : ''),
      note: r.voided_at && r.void_reason ? (r.note ? r.note + ' — سبب الإلغاء: ' + r.void_reason : 'سبب الإلغاء: ' + r.void_reason) : r.note,
      by: r.profiles?.name, debit: 0, credit: r.voided_at ? 0 : (Number(r.amount) || 0)
    }))
  ].sort(cmpStatement);

  let running = 0, totalDebit = 0, totalCredit = 0;
  for (const r of rows){
    r.balance = Math.round((running + r.debit - r.credit) * 100) / 100;
    running = r.balance;
    if (!r.voided){ totalDebit += r.debit; totalCredit += r.credit; }
  }
  return { rows, totalDebit: Math.round(totalDebit*100)/100, totalCredit: Math.round(totalCredit*100)/100, finalBalance: running };
}

function feedRange(){
  const days = Number($('#feed-days')?.value) || 0, selected = $('#feed-date')?.value;
  let from = null, to = null;
  if (selected){
    from = new Date(selected + 'T00:00:00');
    to = new Date(from); to.setDate(to.getDate() + 1);
  } else if (days > 0){
    from = new Date(); from.setHours(0, 0, 0, 0);
    from.setDate(from.getDate() - (days - 1));
  }
  return { from, to };
}

function feedQueries(){
  const fc = $('#feed-customer')?.value || '', { from, to } = feedRange();
  let qi = sb.from('invoices').select('id,total,note,kind,created_at,voided_at,void_reason,edited_at,customer_id,customers(name),profiles!invoices_created_by_fkey(name)').order('id',{ascending:false}).limit(200);
  let qp = sb.from('payments').select('id,amount,note,created_at,voided_at,void_reason,edited_at,customer_id,customers(name),profiles!payments_created_by_fkey(name)').order('id',{ascending:false}).limit(200);
  for (const f of [q => fc ? q.eq('customer_id', fc) : q, q => from ? q.gte('created_at', from.toISOString()) : q, q => to ? q.lt('created_at', to.toISOString()) : q]) { qi = f(qi); qp = f(qp); }
  return [qi, qp];
}
function renderFeed(){
  const box = $('#recent-tx');
  if (!box) return;
  const customer = $('#feed-customer')?.value || '', type = $('#feed-type')?.value || '';
  const { from, to } = feedRange();
  const inRange = d => { const date = new Date(d); return (!from || date >= from) && (!to || date < to); };
  const rows = [
    ...(type === 'payment' ? [] : I.map(r => ({
      src: 'inv', k: r.voided_at ? 'void' : (r.kind === 'disbursement' ? 'settlement' : 'inv'), kind: r.kind, id: r.id, edited: Boolean(r.edited_at), d: r.created_at,
      id: r.id, cid: r.customer_id, who: r.customers?.name, amt: Number(r.total), by: r.profiles?.name,
      title: (r.kind === 'disbursement' ? 'فاتورة سداد' : 'فاتورة دين') + ' #' + r.id
    }))),
    ...(type === 'invoice' || type === 'disbursement' ? [] : Y.map(r => ({
      src: 'pay', k: r.voided_at ? 'void' : 'pay', id: r.id, edited: Boolean(r.edited_at), d: r.created_at, cid: r.customer_id, who: r.customers?.name,
      amt: Number(r.amount), by: r.profiles?.name, title: 'إيصال قبض #' + r.id + (r.voided_at ? ' (ملغى)' : '')
    })))
  ].filter(r => (!customer || r.cid === customer) &&
    (!type || (type === 'payment' ? r.src === 'pay' : type === 'invoice' ? r.kind === 'invoice' : type === 'disbursement' ? r.kind === 'disbursement' : true)) && inRange(r.d))
   .sort((a, b) => new Date(b.d) - new Date(a.d));
  const summary = $('#feed-summary');
  if (summary) summary.textContent = `عدد الحركات المعروضة: ${rows.length} (حتى 200 لكل نوع) · ${from ? (to ? 'التاريخ المحدد' : 'من ' + from.toLocaleDateString('ar')) : 'كل التواريخ'}`;
  box.innerHTML = rows.length ? rows.map(r => txCardHTML(r)).join('') : '<div class="empty">لا توجد حركات مطابقة.</div>';
}

/* ---- اختيارات الفاتورة الجديدة ---- */
function normalizeCustomerSearch(value){
  return String(value ?? '').trim().toLocaleLowerCase('ar')
    .replace(/[٠-٩]/g, d => String(d.charCodeAt(0) - 0x0660))
    .replace(/[۰-۹]/g, d => String(d.charCodeAt(0) - 0x06f0))
    .replace(/^#\s*/, '').trim();
}
function customerMatchesSearch(c, query){
  const q = normalizeCustomerSearch(query);
  if (!q) return true;
  const name = normalizeCustomerSearch(c?.name || '');
  const number = normalizeCustomerSearch(c?.customer_no ?? '');
  return name.includes(q) || (!!number && number.startsWith(q));
}
function customerNoLabel(c){
  const n = Number(c?.customer_no);
  return Number.isSafeInteger(n) && n > 0 ? `#${n}` : '';
}
let customerOptionsOpen = false, customerActiveIndex = -1;
function closeCustomerOptions(){
  customerOptionsOpen = false; customerActiveIndex = -1;
  const box = $('#inv-customer-options'), input = $('#inv-customer-search');
  box.classList.add('hidden'); input.setAttribute('aria-expanded', 'false'); input.removeAttribute('aria-activedescendant');
}
function renderCustomerOptions(){
  const input = $('#inv-customer-search'), box = $('#inv-customer-options');
  if (!customerOptionsOpen){ box.classList.add('hidden'); input.setAttribute('aria-expanded', 'false'); return; }
  const query = normalizeCustomerSearch(input.value);
  const matches = query ? C.filter(c => customerMatchesSearch(c, query)) : C;
  box.replaceChildren(); customerActiveIndex = -1; input.removeAttribute('aria-activedescendant');
  if (!matches.length){
    const empty = document.createElement('div'); empty.className = 'empty'; empty.textContent = 'لا يوجد عميل مطابق للبحث.'; box.appendChild(empty);
  } else matches.forEach((c, index) => {
    const option = document.createElement('div'); option.className = 'customer-option'; option.id = `inv-customer-option-${index}`;
    option.setAttribute('role', 'option'); option.setAttribute('aria-selected', 'false'); option.dataset.customerOption = String(c.id);
    const no = customerNoLabel(c), name = document.createElement('span'); name.className = 'customer-option-name'; name.textContent = `${c.name || 'عميل بلا اسم'}${no ? ` ${no}` : ''}`;
    const debt = Number(c.debt || 0), amount = document.createElement('span');
    amount.className = 'customer-option-debt' + (debt > 0 ? ' debt' : ''); amount.textContent = debt > 0 ? `الدين ${fmt(debt)}` : 'بلا دين';
    option.append(name, amount); box.appendChild(option);
  });
  box.classList.remove('hidden'); input.setAttribute('aria-expanded', 'true');
}
function activateCustomerOption(index){
  const options = [...$('#inv-customer-options').querySelectorAll('[data-customer-option]')];
  if (!options.length) return;
  customerActiveIndex = (index + options.length) % options.length;
  options.forEach((option, i) => option.setAttribute('aria-selected', String(i === customerActiveIndex)));
  const input = $('#inv-customer-search'); input.setAttribute('aria-activedescendant', options[customerActiveIndex].id);
  options[customerActiveIndex].scrollIntoView({ block: 'nearest' });
}
function chooseInvoiceCustomer(id){
  const c = C.find(x => String(x.id) === String(id)); if (!c) return;
  $('#inv-customer').value = String(c.id); $('#inv-customer-search').value = c.name || '';
  closeCustomerOptions(); hint();
}
function renderNewInvoiceSelects(){
  const selected = $('#inv-customer'), input = $('#inv-customer-search');
  const c = C.find(x => String(x.id) === String(selected.value));
  if (c) input.value = c.name || '';
  else if (selected.value){ selected.value = ''; input.value = ''; }
  if (customerOptionsOpen) renderCustomerOptions();
  hint();
}
function hint(){
  const c = C.find(x => String(x.id) === String($('#inv-customer').value)), h = $('#cust-hint');
  if (!c) return h.textContent = '';
  const lim = Number(c.credit_limit), debt = Number(c.debt);
  h.textContent = `الدين الحالي ${fmt(debt)} · حد الائتمان ${lim > 0 ? fmt(lim) : 'بلا حد'}` + (lim > 0 ? ` · المتاح ${fmt(lim - debt)}` : '');
}
$('#inv-customer-search').addEventListener('focus', () => { customerOptionsOpen = true; renderCustomerOptions(); });
$('#inv-customer-search').addEventListener('input', () => {
  $('#inv-customer').value = ''; hint(); customerOptionsOpen = true; renderCustomerOptions();
});
$('#inv-customer-search').addEventListener('keydown', e => {
  if (e.key === 'Escape' && customerOptionsOpen){ e.preventDefault(); closeCustomerOptions(); return; }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    e.preventDefault();
    if (!customerOptionsOpen){ customerOptionsOpen = true; renderCustomerOptions(); }
    const options = $('#inv-customer-options').querySelectorAll('[data-customer-option]');
    if (options.length) activateCustomerOption(customerActiveIndex < 0 ? (e.key === 'ArrowDown' ? 0 : options.length - 1) : customerActiveIndex + (e.key === 'ArrowDown' ? 1 : -1));
    return;
  }
  if (e.key === 'Enter' && customerOptionsOpen){
    const options = [...$('#inv-customer-options').querySelectorAll('[data-customer-option]')];
    const choice = customerActiveIndex >= 0 ? options[customerActiveIndex] : ($('#inv-customer-search').value.trim() ? options[0] : null);
    if (choice){ e.preventDefault(); chooseInvoiceCustomer(choice.dataset.customerOption); }
  }
});
$('#inv-customer-options').addEventListener('click', e => {
  const option = e.target.closest('[data-customer-option]'); if (option) chooseInvoiceCustomer(option.dataset.customerOption);
});
document.addEventListener('pointerdown', e => {
  if (!$('#invoice-customer-picker').contains(e.target)) closeCustomerOptions();
});
document.addEventListener('focusin', e => {
  if (!$('#invoice-customer-picker').contains(e.target)) closeCustomerOptions();
});


/* ---- قائمة العملاء ---- */
function renderCustomersList(){
  // الرصيد السالب يعني فائضاً للعميل، لذلك يُحسب ضمن الإجمالي الصافي.
  $('#total-debt').textContent = fmt(C.reduce((s, c) => s + Number(c.debt || 0), 0));
  const query = normalizeCustomerSearch($('#customer-search')?.value || '');
  const sortMode = $('#customer-sort')?.dataset.mode || 'number';
  const matching = query ? C.filter(c => customerMatchesSearch(c, query)) : C;
  const visible = [...matching].sort((a, b) => {
    const numberDiff = Number(a.customer_no) - Number(b.customer_no);
    if (sortMode === 'debt-desc'){
      const debtDiff = Number(b.debt || 0) - Number(a.debt || 0);
      if (debtDiff) return debtDiff;
    }
    return numberDiff || coll.compare(a.name || '', b.name || '');
  });
  $('#customers').innerHTML = visible.length ? visible.map(c => {
    const debt = Number(c.debt), no = customerNoLabel(c);
    return `<div class="cust-card" data-open-customer="${c.id}">
      <div class="top-row">
        <span class="cname">${esc(c.name)}${no ? ` <bdi dir="ltr">${no}</bdi>` : ''}</span>
        <span class="cdebt ${debt > 0 ? 'debt' : 'ok'}">${fmt(debt)}</span>
      </div>
      <div class="meta">حد الائتمان: ${Number(c.credit_limit) > 0 ? fmt(c.credit_limit) : 'بلا حد'}</div>
      <div class="meta" style="display:flex;justify-content:space-between;align-items:center">
        <span>اضغط للعرض</span><span class="arrow">‹</span>
      </div>
    </div>`;
  }).join('')
    : (query ? '<div class="empty">لا يوجد عميل مطابق للبحث.</div>' : '<div class="empty">لا يوجد عملاء. أضف أول عميل من شاشة «فاتورة جديدة».</div>');
}

$('#customer-search').oninput = renderCustomersList;
$('#customer-sort').addEventListener('click', () => {
  const button = $('#customer-sort');
  const debtFirst = button.dataset.mode !== 'debt-desc';
  button.dataset.mode = debtFirst ? 'debt-desc' : 'number';
  button.setAttribute('aria-pressed', String(debtFirst));
  button.setAttribute('aria-label', debtFirst
    ? 'الترتيب الحالي: أعلى رصيد دين. اضغط للتبديل إلى الرقم التسلسلي'
    : 'الترتيب الحالي: الرقم التسلسلي. اضغط للتبديل إلى أعلى رصيد دين');
  $('#customer-sort-label').textContent = debtFirst ? 'أعلى دين' : 'الرقم';
  renderCustomersList();
});

  // الكشف يُقرأ من الجلب المنفصل؛ لا يُعرض إلا كاملاً حتى لا يخطئ الرصيد

      <div class="t2"><span>${esc(dt(r.d))}</span><span>${esc(r.by || '—')}</span></div>

        ${r.src === 'pay' && !r.voided && admin ? `<button class="btn alt sm" data-edit-payment="${r.id}">تعديل التسديد</button>` : ''}
        ${r.src === 'pay' && !r.voided ? `<button class="btn del sm" data-void-payment="${r.id}">إلغاء التسديد</button>` : ''}

      </div>` : ''}

  }).join('')

/* ============ حفظ كشف الحساب والإيصالات كصور ============ */
const IMG_W = 800, IMG_H = 1130, IMG_SC = 1.5, IMG_FONT = 'Cairo, Tahoma, Arial, sans-serif';
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const palette = () => ({ main: cssv('--main') || '#0f5c4d', bad: cssv('--bad') || '#b3261e', ok: cssv('--ok') || '#166534', line: cssv('--line') || '#d9dfdc' });
const tripoliDate = (d, dateOnly = false) => dateOnly
  ? new Date(d).toLocaleDateString('ar', { timeZone: 'Africa/Tripoli' })
  : new Date(d).toLocaleString('ar', { timeZone: 'Africa/Tripoli' });
function newCanvas(h){
  const c = document.createElement('canvas'); c.width = IMG_W * IMG_SC; c.height = h * IMG_SC;
  const x = c.getContext('2d');
  if (!x) throw new Error('تعذّر إنشاء لوحة الصورة');
  x.scale(IMG_SC, IMG_SC); x.fillStyle = '#fff'; x.fillRect(0, 0, IMG_W, h); x.direction = 'rtl'; x.textBaseline = 'middle';
  return { c, x };
}
function T(x, s, px, py, o = {}){ x.font = `${o.w || 400} ${o.s || 15}px ${IMG_FONT}`; x.fillStyle = o.col || '#111'; x.textAlign = o.al || 'right'; x.fillText(String(s), px, py); }
function wrapText(x, s, maxW, font, maxLines = 99){
  x.font = font; const out = [];
  String(s).split('\n').forEach(par => { let cur = ''; par.split(/\s+/).forEach(w => { const t = cur ? cur + ' ' + w : w; if (cur && x.measureText(t).width > maxW){ out.push(cur); cur = w; } else cur = t; }); out.push(cur); });
  if (out.length > maxLines){ out.length = maxLines; out[maxLines - 1] += '…'; }
  return out;
}
function rrect(x, rx, ry, w, h, r, fill, stroke){
  x.beginPath(); x.roundRect ? x.roundRect(rx, ry, w, h, r) : x.rect(rx, ry, w, h);
  if (fill){ x.fillStyle = fill; x.fill(); } if (stroke){ x.strokeStyle = stroke; x.lineWidth = 2; x.stroke(); }
}
function drawHead(x, title){
  const p = palette(); rrect(x, 24, 24, IMG_W - 48, 64, 10, p.main);
  T(x, STORE_NAME, IMG_W - 44, 56, { w: 800, s: 24, col: '#fff' });
  T(x, title, 44, 56, { w: 800, s: 20, col: '#fff', al: 'left' });
  return 108;
}
function drawAmountBox(x, bx, y, label, value){
  const p = palette(); rrect(x, bx, y, 240, 84, 12, '#fff', p.main); rrect(x, bx, y, 240, 32, 12, p.main);
  T(x, label, bx + 120, y + 17, { w: 800, s: 14, col: '#fff', al: 'center' });
  T(x, value, bx + 120, y + 58, { w: 900, s: 28, col: p.main, al: 'center' });
}
function drawSign(x, y, stamp){
  if (stamp){ const k = Math.min(180 / stamp.width, 110 / stamp.height); x.drawImage(stamp, IMG_W - 44 - stamp.width * k, y, stamp.width * k, stamp.height * k); }
  x.strokeStyle = '#555'; x.lineWidth = 1; x.beginPath(); x.moveTo(44, y + 90); x.lineTo(284, y + 90); x.stroke();
  T(x, 'توقيع العميل', 164, y + 108, { s: 14, al: 'center' });
}
const loadStamp = () => new Promise(res => {
  const i = new Image(); let done = false;
  const finish = value => { if (done) return; done = true; clearTimeout(timer); res(value); };
  const timer = setTimeout(() => finish(null), 2500);
  i.onload = () => finish(i); i.onerror = () => finish(null); i.src = 'stamp.png';
});

const WA_COUNTRY = '218'; // رمز ليبيا للأرقام المحلية؛ الأرقام الدولية تُحفظ كما هي.
function waNumber(phone){
  const raw = String(phone || '').trim();
  let d = raw.replace(/[٠-٩]/g, n => String('٠١٢٣٤٥٦٧٨٩'.indexOf(n)))
    .replace(/[۰-۹]/g, n => String('۰۱۲۳۴۵۶۷۸۹'.indexOf(n))).replace(/\D/g, '');
  if (!d) return '';
  const international = raw.startsWith('+') || d.startsWith('00');
  if (d.startsWith('00')) d = d.slice(2);
  if (international && d.startsWith('0')) return '';
  if (!international && d.startsWith('0')) d = WA_COUNTRY + d.slice(1);
  else if (!international && !d.startsWith(WA_COUNTRY) && d.length <= 10) return '';
  return d.length >= 8 && d.length <= 15 ? d : '';
}

async function adminCall(body){
  const result = await sb.functions.invoke('user-admin', { body });
  if (!result.error) return result;
  let message = result.error.message || 'خطأ غير معروف';
  try {
    const ctx = result.error.context;
    if (ctx && typeof ctx.json === 'function') {
      const detail = await ctx.json();
      if (detail?.error) message = detail.error;
      else if (detail?.message) message = detail.message;
    }
  } catch (_) {}
  if (/non-2xx/i.test(message)) {
    try {
      const ctx = result.error.context;
      if (ctx && typeof ctx.text === 'function') {
        const text = await ctx.text();
        try { const j = JSON.parse(text); message = j?.error || j?.message || message; }
        catch (_) { if (text) message = text.slice(0, 200); }
      }
    } catch (_) {}
  }
  const dict = {
    'Password should be at least 6 characters': 'كلمة المرور يجب أن تكون 6 أحرف على الأقل',
    'Password is known to be weak and easy to guess': 'كلمة المرور ضعيفة أو مسرّبة، اختر كلمة أخرى',
    'User already registered': 'اسم المستخدم مستخدم بالفعل',
    'A user with this email address has already been registered': 'اسم المستخدم مستخدم بالفعل',
    'Unable to validate email address': 'اسم المستخدم يحتوي أحرفاً غير صحيحة'
  };
  for (const [en, ar] of Object.entries(dict)) if (message.includes(en)) { message = ar; break; }
  return { data: { error: message }, error: null };
}

  U = data.users || [];
  $('#users').innerHTML = U.length ? U.map(u => `
    <div class="cust-card" style="cursor:default">
      <div class="top-row">
        <div style="flex:1;min-width:0">
          <div class="cname">${esc(u.name || u.username)}</div>
          <div class="meta">@${esc(u.username)} · ${u.role === 'admin' ? 'مدير' : 'بائع'}</div>
        </div>
        <button class="btn alt sm" data-edit-user="${u.id}">تعديل</button>
      </div>
    </div>`).join('')
    : '<div class="empty">لا يوجد مستخدمون.</div>';
}
function resetUserForm(){
  editingUserId = null;
  $('#user-form-title').textContent = 'إضافة مستخدم';
  $('#btn-save-user').textContent = 'إضافة المستخدم';
  $('#btn-cancel-user').classList.add('hidden');
  $('#u-username').value = ''; $('#u-name').value = ''; $('#u-role').value = 'seller'; $('#u-password').value = '';
}
$('#btn-save-user').onclick = async () => {
  const password = $('#u-password').value;
  const username = $('#u-username').value.trim();
  const isNew = !editingUserId;

  if (!/^[a-zA-Z0-9_\u0600-\u06FF]{3,}$/.test(username))
    return toast('اسم المستخدم 3 أحرف على الأقل (بدون مسافات)', false);
  if (password && password.length < 6)
    return toast('كلمة المرور يجب أن تكون 6 أحرف على الأقل', false);
  if (isNew && !password)
    return toast('أدخل كلمة المرور', false);

  const body = { action: isNew ? 'create' : 'update', username,
    name: $('#u-name').value.trim(), role: $('#u-role').value, password };
  if (!isNew) body.id = editingUserId;
  const b = $('#btn-save-user'); b.disabled = true;
  const { data } = await adminCall(body);
  b.disabled = false;
  if (data?.error) return toast(data.error, false);
  toast(isNew ? 'تمت إضافة المستخدم' : 'تم تعديل المستخدم');
  resetUserForm(); loadUsers();
};
$('#btn-cancel-user').onclick = resetUserForm;
</script>
</body>
</html>
