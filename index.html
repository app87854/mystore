<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5c4d">
<title>سجل الديون</title>
<style>
  :root{--ink:#1c2321;--mute:#66736f;--line:#d9dfdc;--bg:#f3f5f2;--main:#0f5c4d;--bad:#b3261e;--ok:#166534;--nav-h:64px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;font-family:system-ui,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;width:100%;background:#fff;color:var(--ink)}
  textarea{min-height:80px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--main);outline-offset:1px}


  /* ====== الهيكل العام ====== */
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh}

  header{background:var(--main);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:8px;padding-top:calc(10px + env(safe-area-inset-top))}
  header h1{margin:0;font-size:16px;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .who{font-size:12px;opacity:.85;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
  header button{background:rgba(255,255,255,.15);padding:6px 10px;border-radius:8px;font-size:13px;color:#fff;white-space:nowrap}

  main{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px;padding-bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  body.detail main{padding-bottom:20px}

  .screen{display:flex;flex-direction:column;gap:12px}
  .screen.hidden{display:none}


  /* ====== الشريط السفلي ====== */
  #bottom-nav{
    position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);
    padding-bottom:env(safe-area-inset-bottom);
    background:#fff;border-top:1px solid var(--line);
    display:flex;justify-content:space-around;align-items:center;
    z-index:20;box-shadow:0 -2px 8px rgba(0,0,0,.04)
  }
  #bottom-nav.hidden{display:none}
  #bottom-nav button{
    flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;font-size:11px;color:var(--mute);padding:6px 2px
  }
  #bottom-nav button .ico{font-size:22px;line-height:1}
  #bottom-nav button.on{color:var(--main);font-weight:700}
  #bottom-nav button.on .ico{transform:scale(1.1)}


  /* ====== بطاقات ====== */
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
  h2{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
  .btn{padding:11px 14px;border-radius:10px;border:1px solid var(--main);background:var(--main);color:#fff;font-weight:600}
  .btn.alt{background:#fff;color:var(--main)}
  .btn.del{background:#fff;color:var(--bad);border-color:var(--bad)}
  .btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
  .btn:disabled{opacity:.5}
  .empty{color:var(--mute);padding:20px;text-align:center;font-size:14px}
  .hint{color:var(--mute);font-size:13px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stack{display:flex;flex-direction:column;gap:10px}
  label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mute)}


  /* ====== KPI ====== */
  .kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kpi>div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12px;color:var(--mute)}
  .kpi b{display:block;font-size:20px;color:var(--ink);margin-top:6px;font-weight:800}
  .kpi b.debt{color:var(--bad)}
  .kpi b.ok{color:var(--ok)}
  .kpi>div.wide{grid-column:1/-1}


  /* ====== قائمة العملاء ====== */
  .cust-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:transform .1s}
  .cust-card:active{transform:scale(.99)}
  .cust-card .top-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .cust-card .cname{font-size:16px;font-weight:700;word-break:break-word;flex:1}
  .cust-card .cdebt{font-size:17px;font-weight:700;white-space:nowrap}
  .cust-card .cdebt.debt{color:var(--bad)}
  .cust-card .cdebt.ok{color:var(--ok)}
  .cust-card .meta{font-size:12px;color:var(--mute)}
  .cust-card .arrow{color:var(--mute);font-size:20px;line-height:1}


  /* ====== ملف العميل ====== */
  .profile-head{background:linear-gradient(135deg,var(--main) 0%,#0a3f34 100%);color:#fff;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
  .profile-head .pname{font-size:22px;font-weight:800;word-break:break-word}
  .profile-head .pbal{font-size:32px;font-weight:900;line-height:1}
  .profile-head .pmeta{font-size:13px;opacity:.9}
  .profile-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
  .profile-actions .btn{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3);color:#fff}
  .profile-actions .btn:hover{background:rgba(255,255,255,.25)}


  /* ====== بطاقات الحركات ====== */
  .tx-list{display:flex;flex-direction:column;gap:8px}
  .tx{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;background:#fff;border-right-width:4px}
  .tx.inv{border-right-color:var(--bad)}
  .tx.pay{border-right-color:var(--ok);background:#f6fdf9}
  .tx.out{border-right-color:#e9c27a;background:#fffbf2}
  .tx.void{opacity:.55;background:#f6f6f6;border-right-color:#999}
  .tx .t1{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14px}
  .tx .t2{display:flex;justify-content:space-between;color:var(--mute);font-size:12px}
  .tx .note{font-size:13px;background:#f8fafc;padding:6px 8px;border-radius:6px;white-space:pre-wrap;word-break:break-word}
  .tx .run{font-size:12px;color:var(--mute);border-top:1px dashed var(--line);padding-top:6px;display:flex;justify-content:space-between}
  .tx .run b{color:var(--ink)}
  .tx .actions{display:flex;gap:6px;flex-wrap:wrap;padding-top:4px}
  .tx .tag{font-size:11px;border:1px solid var(--line);border-radius:20px;padding:1px 7px;color:var(--mute)}


  /* ====== شاشة الدخول ====== */
  #login{position:fixed;inset:0;background:var(--main);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
  #login .card{width:min(360px,100%);margin:0}


  /* ====== التنبيه ====== */
  #toast{position:fixed;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:11px 20px;border-radius:10px;color:#fff;display:none;z-index:60;max-width:calc(100% - 32px);text-align:center;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
  body.detail #toast{bottom:calc(16px + env(safe-area-inset-bottom))}
  #toast.ok{background:var(--ok);display:block}
  #toast.err{background:var(--bad);display:block}
  .hidden{display:none!important}

  /* ====== كشف الحساب المطبوع ====== */
  .print-only{display:none}
  @media print{
    @page{size:A4 portrait;margin:12mm}
    html,body{height:auto;overflow:visible;background:#fff}
    body > *:not(#print-area){display:none!important}
    #print-area{display:block!important;color:#000;background:#fff;font-family:Cairo,Tahoma,Arial,sans-serif;direction:rtl;font-size:11px;line-height:1.45}
    #print-area *{color:#000!important;box-shadow:none!important}
    .print-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:12px;gap:16px}
    .print-store{font-size:20px;font-weight:800}
    .print-title{font-size:18px;font-weight:800;text-align:left}
    .print-meta{display:grid;grid-template-columns:1fr 1fr;gap:5px 18px;border:1px solid #999;padding:8px;margin-bottom:12px}
    .print-meta b{font-weight:800}
    .print-table{width:100%;border-collapse:collapse;table-layout:fixed}
    .print-table th,.print-table td{border:1px solid #777;padding:5px 4px;vertical-align:top;word-break:break-word}
    .print-table th{background:#eee;font-weight:800}
    .print-table th:nth-child(1),.print-table td:nth-child(1){width:15%}
    .print-table th:nth-child(2),.print-table td:nth-child(2){width:14%}
    .print-table th:nth-child(3),.print-table td:nth-child(3){width:29%}
    .print-table th:nth-child(4),.print-table td:nth-child(4),.print-table th:nth-child(5),.print-table td:nth-child(5),.print-table th:nth-child(6),.print-table td:nth-child(6){width:14%}
    .print-void{color:#666!important;text-decoration:line-through}
    .print-summary{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #777;border-top:0;margin-bottom:28px}
    .print-summary div{padding:7px;border-left:1px solid #777;text-align:center}
    .print-summary div:last-child{border-left:0}
    .print-sign{display:flex;justify-content:space-between;gap:30px;margin-top:35px;padding-top:10px}
    .print-sign span{display:block;border-top:1px solid #000;width:35%;text-align:center;padding-top:5px}
    .print-empty{text-align:center;border:1px solid #777;padding:30px;margin:20px 0}
    .print-warn{border:2px solid #000;padding:7px 9px;margin-bottom:10px;font-weight:800}
  }
</style>
</head>
<body>


<div id="login"><div class="card">
  <h2>تسجيل الدخول</h2>
  <label>اسم المستخدم<input id="username" autocomplete="username"></label>
  <label style="margin-top:10px">كلمة المرور<input id="pass" type="password" autocomplete="current-password"></label>
  <button id="btn-login" class="btn" style="width:100%;margin-top:14px">دخول</button>
</div></div>


<div id="app" class="hidden">
  <header>
    <button id="btn-back" class="hidden">→</button>
    <h1 id="screen-title">الإحصائيات</h1>
    <span class="who" id="me"></span>
    <button id="btn-out">خروج</button>
  </header>


  <main>
    <!-- ==== شاشة 1: الإحصائيات ==== -->
    <section id="screen-stats" class="screen">
      <div class="kpi" id="kpi"></div>
      <div class="card">
        <h2>آخر الحركات</h2>
        <div class="tx-list" id="recent-tx"></div>
      </div>
      <div class="card">
        <h2>أكثر المدينين</h2>
        <div class="tx-list" id="top-debtors"></div>
      </div>
    </section>


    <!-- ==== شاشة 2: فاتورة جديدة ==== -->
    <section id="screen-new" class="screen hidden">
      <div class="card">
        <h2>فاتورة جديدة</h2>
        <div class="stack">
          <label>النوع
            <select id="inv-kind">
              <option value="invoice">فاتورة دين (زيادة رصيد)</option>
              <option value="disbursement">إيصال صرف نقدي</option>
            </select>
          </label>
          <label>العميل<select id="inv-customer"></select></label>
          <div class="hint" id="cust-hint"></div>
          <label>القيمة<input id="inv-amount" type="number" min="0" step="any" inputmode="decimal" placeholder="0.00"></label>
          <label>المشتريات / البيان<textarea id="inv-note" placeholder="مثال: 2 كيس سكر، 1 زيت"></textarea></label>
          <button id="btn-save" class="btn" style="padding:14px;font-size:16px">حفظ الفاتورة</button>
        </div>
      </div>
      <div class="card">
        <h2>إضافة عميل سريع</h2>
        <div class="stack">
          <label>الاسم<input id="c-name"></label>
          <label id="credit-limit-field">حد الائتمان (0 = بلا حد)<input id="c-limit" type="number" min="0" step="any" value="0" inputmode="decimal"></label>
          <button id="btn-add-c" class="btn alt">إضافة العميل</button>
        </div>
      </div>
    </section>


    <!-- ==== شاشة 3: العملاء ==== -->
    <section id="screen-customers" class="screen hidden">
      <div class="card" style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:14px">إجمالي الديون</span>
        <b id="total-debt" style="font-size:18px;color:var(--bad)">0.00</b>
      </div>
      <div class="cust-list stack" id="customers"></div>
    </section>


    <!-- ==== شاشة 4: ملف العميل ==== -->
    <section id="screen-customer" class="screen hidden">
      <div class="profile-head" id="profile-head"></div>
      <div class="card">
        <h2>كشف الحركات</h2>
        <div class="tx-list" id="customer-tx"></div>
      </div>
    </section>


    <!-- ==== شاشة 5: المستخدمون ==== -->
    <section id="screen-users" class="screen hidden">
      <div class="card">
        <h2 id="user-form-title">إضافة مستخدم</h2>
        <div class="stack">
          <label>اسم المستخدم<input id="u-username" autocomplete="off"></label>
          <label>الاسم الظاهر<input id="u-name"></label>
          <label>الدور<select id="u-role"><option value="seller">بائع</option><option value="admin">مدير</option></select></label>
          <label>كلمة المرور<input id="u-password" type="password" autocomplete="new-password" placeholder="6 أحرف على الأقل"></label>
          <button id="btn-save-user" class="btn">إضافة المستخدم</button>
          <button id="btn-cancel-user" class="btn alt hidden">إلغاء التعديل</button>
        </div>
      </div>
      <div class="card">
        <h2>المستخدمون</h2>
        <div class="tx-list" id="users"></div>
      </div>
    </section>
  </main>


  <nav id="bottom-nav">
    <button data-screen="stats" class="on"><span class="ico">📊</span>الإحصائيات</button>
    <button data-screen="new"><span class="ico">➕</span>فاتورة</button>
    <button data-screen="customers"><span class="ico">👥</span>العملاء</button>
    <button data-screen="users" id="nav-users" class="hidden"><span class="ico">⚙️</span>المستخدمون</button>
  </nav>
</div>


<div id="toast"></div>

<div id="print-area" class="print-only"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://arrebmwpzrlmeulzplkm.supabase.co';
const SUPABASE_KEY = 'sb_publishable_SFNd6AiGkvWxm6u0KgSpTg_ocFlAUuI';
const STORE_NAME   = 'سجل الديون';


const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt = n => (Number(n) || 0).toFixed(2);
const num = s => Number(String(s ?? '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/٫/g, '.').replace(/[٬,\s]/g, ''));
const dt = d => new Date(d).toLocaleString('ar', { dateStyle:'short', timeStyle:'short' });
const coll = new Intl.Collator('ar', { numeric: true, sensitivity: 'base' });


document.title = STORE_NAME;


let C = [], I = [], Y = [], U = [], admin = false;
let channel = null, timer, loading = false, dirty = false, state = {};
let screen = 'stats';
let detailCustomerId = null;
let editingUserId = null;
const TX = {};            // كشف كامل لكل عميل (يُجلب منفردة حتى لا يُقتطع)
const TX_INV = 'id,total,note,kind,created_at,voided_at,void_reason,profiles(name)';
const TX_PAY = 'id,amount,note,created_at,profiles(name)';


function toast(msg, ok = true){
  const t = $('#toast'); t.textContent = msg; t.className = ok ? 'ok' : 'err';
  clearTimeout(timer); timer = setTimeout(() => t.className = '', 3500);
}


/* ============ التنقل بين الشاشات ============ */
const TITLES = {
  stats: 'الإحصائيات',
  new: 'فاتورة جديدة',
  customers: 'العملاء',
  customer: 'ملف العميل',
  users: 'المستخدمون'
};
function goTo(name){
  screen = name;
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  const el = $('#screen-' + name);
  if (el) el.classList.remove('hidden');
  $('#screen-title').textContent = TITLES[name] || STORE_NAME;

  // شريط التنقل يظهر فقط على الشاشات الرئيسية
  const isDetail = name === 'customer';
  $('#bottom-nav').classList.toggle('hidden', isDetail);
  $('#btn-back').classList.toggle('hidden', !isDetail);
  document.body.classList.toggle('detail', isDetail);

  document.querySelectorAll('#bottom-nav button').forEach(b =>
    b.classList.toggle('on', b.dataset.screen === name));
  $('main').scrollTop = 0;
  if (name === 'users') loadUsers();
}
document.querySelectorAll('#bottom-nav button').forEach(b => b.onclick = () => goTo(b.dataset.screen));
$('#btn-back').onclick = () => { detailCustomerId = null; goTo('customers'); render(); };


/* ============ الدخول ============ */
$('#btn-login').onclick = async () => {
  const username = $('#username').value.trim(), password = $('#pass').value;
  if (!username || !password) return toast('أدخل اسم المستخدم وكلمة المرور', false);
  const { data: email, error: lookupError } = await sb.rpc('login_email', { p_username: username });
  if (lookupError || !email) return toast('اسم المستخدم أو كلمة المرور غير صحيحة', false);
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) toast('اسم المستخدم أو كلمة المرور غير صحيحة', false);
};
['#username','#pass'].forEach(s => $(s).onkeydown = e => { if (e.key === 'Enter') $('#btn-login').click(); });
$('#btn-out').onclick = async () => {
  if (channel) { await sb.removeChannel(channel); channel = null; }
  await sb.auth.signOut();
};
sb.auth.onAuthStateChange((_e, session) => {
  $('#login').classList.toggle('hidden', !!session);
  $('#app').classList.toggle('hidden', !session);
  if (session) { goTo('stats'); load(); subscribe(); }
  else {
    C = []; I = []; Y = []; U = []; state = {}; admin = false; detailCustomerId = null;
    for (const k in TX) delete TX[k];
    ['#kpi','#recent-tx','#top-debtors','#customers','#users','#customer-tx','#profile-head'].forEach(s => { const e = $(s); if (e) e.innerHTML = ''; });
    if (channel) { sb.removeChannel(channel); channel = null; }
  }
});


/* ============ التحميل والمزامنة ============ */
async function load(){
  if (loading) { dirty = true; return; }
  loading = true;
  try { await loadNow(); } finally { loading = false; if (dirty) { dirty = false; load(); } }
}
async function loadNow(){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) return;
  const [c, i, y, me, s] = await Promise.all([
    sb.from('customer_balances').select('*').order('name'),
    sb.from('invoices').select('id,total,note,kind,created_at,voided_at,void_reason,customer_id,customers(name),profiles(name)').order('id',{ascending:false}).limit(200),
    sb.from('payments').select('id,amount,note,created_at,customer_id,customers(name),profiles(name)').order('id',{ascending:false}).limit(200),
    sb.from('profiles').select('name,role').eq('id', session.user.id).maybeSingle(),
    sb.from('store_stats').select('*').single()
  ]);
  const err = c.error || i.error || y.error || me.error || s.error;
  if (err) return toast('خطأ في التحميل: ' + err.message, false);
  C = [...(c.data || [])].sort((a, b) => coll.compare(a.name || '', b.name || ''));
  I = i.data || []; Y = y.data || []; state = s.data || {};
  admin = me.data?.role === 'admin';
  $('#nav-users').classList.toggle('hidden', !admin);
  $('#credit-limit-field').classList.toggle('hidden', !admin);
  $('#me').textContent = (me.data?.name || '') + (admin ? ' (مدير)' : ' (بائع)');
  render();
  // إن كان ملف عميل مفتوحاً: حدّث كشفه من جديد (دون إفراغ الشاشة)
  if (detailCustomerId) loadTx(detailCustomerId);
}
function subscribe(){
  if (channel) return;
  let t; const again = () => { clearTimeout(t); t = setTimeout(load, 300); };
  channel = sb.channel('live');
  ['invoices','customers','payments'].forEach(tb =>
    channel.on('postgres_changes', { event:'*', schema:'public', table:tb }, again));
  channel.subscribe();
}


/* ============ كشف حساب العميل (يُجلب كاملاً) ============ */
// PostgREST قد يحدّ-rows لكل استجابة، فنقسم على صفحات ونقارن بعدد الصفوف الكلي
const PAGE = 1000;
async function fetchAll(table, cols, customerId){
  const out = []; let from = 0, count = null;
  for (let guard = 0; guard < 1000; guard++){
    const { data, error, count: c } = await sb.from(table)
      .select(cols, { count: 'exact' })
      .eq('customer_id', customerId)
      .order('created_at',{ascending:true}).order('id',{ascending:true})
      .range(from, from + PAGE - 1);
    if (error) throw error;
    if (c != null) count = c;
    out.push(...(data || []));
    from += (data || []).length;
    if (!data || !data.length) break;
    if (count != null ? from >= count : data.length < PAGE) break;
  }
  return { rows: out, complete: count == null || out.length >= count };
}

async function loadTx(id){
  try {
    const [i, y] = await Promise.all([
      fetchAll('invoices', TX_INV, id),
      fetchAll('payments', TX_PAY, id)
    ]);
    if (!i.complete || !y.complete) toast('كشف الحساب أطول من الحد المسموح — قد ينقص جزء من الحركات', false);
    TX[String(id)] = { i: i.rows, y: y.rows };
  } catch (e){
    return toast('تعذّر تحميل كشف الحساب: ' + (e.message || e), false);
  }
  if (String(detailCustomerId) === String(id)) renderCustomerDetail(id);
}

  detailCustomerId = id;
  renderCustomerDetail(id);
  goTo('customer');
  loadTx(id);
}

/* ============ طباعة كشف الحساب (جلب كامل مستقل عن القوائم المختصرة) ============ */
async function printStatement(customerId, btn){
  btn = btn || document.querySelector(`[data-print-statement="${customerId}"]`);
  const area = $('#print-area');
  if (btn) { btn.disabled = true; btn.textContent = 'جارٍ التجهيز…'; }
  area.innerHTML = '<div class="empty">جارٍ تجهيز كشف الحساب…</div>';
  try {
    const [cRes, iRes, yRes] = await Promise.all([
      sb.from('customers').select('id,name,phone').eq('id', customerId).single(),
      fetchAll('invoices', TX_INV, customerId),
      fetchAll('payments', TX_PAY, customerId)
    ]);
    if (cRes.error) { area.innerHTML = ''; return toast('تعذّر تجهيز كشف الحساب: ' + cRes.error.message, false); }
    if (!cRes.data)  { area.innerHTML = ''; return toast('العميل غير موجود', false); }

    const iData = iRes.rows || [], yData = yRes.rows || [];
    const complete = iRes.complete && yRes.complete;
    const customer = cRes.data;
    const rows = [
      ...iData.map(r => ({
        date: r.created_at,
        type: r.kind === 'disbursement' ? 'إيصال صرف' : 'فاتورة دين',
        description: `${r.kind === 'disbursement' ? 'إيصال صرف' : 'فاتورة'} #${r.id}${r.note ? ' — ' + r.note : ''}`,
        debit: r.voided_at ? 0 : Number(r.total) || 0,
        credit: 0,
        voided: Boolean(r.voided_at),
        sortId: Number(r.id) || 0
      })),
      ...yData.map(r => ({
        date: r.created_at,
        type: 'تسديد',
        description: `تسديد #${r.id}${r.note ? ' — ' + r.note : ''}`,
        debit: 0,
        credit: Number(r.amount) || 0,
        voided: false,
        sortId: Number(r.id) || 0
      }))
    ].sort((a,b) => new Date(a.date) - new Date(b.date) || a.sortId - b.sortId);

    let running = 0, totalDebit = 0, totalCredit = 0;
    const tableRows = rows.map(r => {
      if (!r.voided) {
        totalDebit += r.debit;
        totalCredit += r.credit;
        running += r.debit - r.credit;
      }
      const label = r.voided ? `${r.description} (ملغاة)` : r.description;
      return `<tr class="${r.voided ? 'print-void' : ''}">
        <td>${esc(new Date(r.date).toLocaleDateString('ar'))}</td>
        <td>${esc(r.type)}${r.voided ? ' (ملغاة)' : ''}</td>
        <td>${esc(label)}</td>
        <td>${r.voided ? '—' : fmt(r.debit)}</td>
        <td>${r.voided ? '—' : fmt(r.credit)}</td>
        <td>${fmt(running)}</td>
      </tr>`;
    }).join('');
    const finalBalance = running;
    const printedAt = new Date().toLocaleString('ar');
    area.innerHTML = `
      <div class="print-head"><div class="print-store">${esc(STORE_NAME)}</div><div class="print-title">كشف حساب</div></div>
      <div class="print-meta">
        <div>العميل: <b>${esc(customer.name)}</b></div>
        <div>الهاتف: <b>${esc(customer.phone || '—')}</b></div>
        <div>الرصيد الحالي: <b>${fmt(finalBalance)}</b></div>
        <div>تاريخ الطباعة: <b>${esc(printedAt)}</b></div>
      </div>
      ${complete ? '' : '<div class="print-warn">تنبيه: تجاوز هذا العميل حدّ الاستجابة، وقد ينقص جزء من حركاته.</div>'}
      ${rows.length ? `<table class="print-table"><thead><tr><th>التاريخ</th><th>النوع</th><th>البيان</th><th>مدين</th><th>دائن</th><th>الرصيد</th></tr></thead><tbody>${tableRows}</tbody></table>` : '<div class="print-empty">لا توجد حركات</div>'}
      <div class="print-summary"><div>إجمالي المدين<br><b>${fmt(totalDebit)}</b></div><div>إجمالي الدائن<br><b>${fmt(totalCredit)}</b></div><div>الرصيد النهائي<br><b>${fmt(finalBalance)}</b></div></div>
      <div class="print-sign"><span>توقيع المسؤول</span><span>توقيع العميل</span></div>`;
    // نؤجّل الطباعة إطارين حتى يكتمل تخطيط الجدول (يمنع صفحة أولى فارغة)
    requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(() => window.print(), 30)));
  } catch (err) {
    area.innerHTML = '';
    toast('تعذّر تجهيز كشف الحساب: ' + (err.message || err), false);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'طباعة كشف الحساب'; }
  }
}
window.addEventListener('afterprint', () => { $('#print-area').innerHTML = ''; });

document.addEventListener('click', e => {
  const open = e.target.closest('[data-open-customer]');
  if (open && !e.target.closest('button')) return openCustomer(open.dataset.openCustomer);

  const g = a => e.target.closest(`[data-${a}]`)?.dataset[a.replace(/-./g, m => m[1].toUpperCase())];
  let v;
  if ((v = g('print-statement'))) return printStatement(v, e.target.closest('[data-print-statement]'));
  if ((v = g('pay'))) {
    const c = C.find(x => String(x.id) === String(v));
    const a = prompt(`المبلغ المسدَّد (الدين الحالي ${fmt(c.debt)}):`, c.debt); if (a === null) return;
    const m = num(a);
    if (!(m > 0)) return toast('أدخل مبلغاً صحيحاً', false);
    if (m > Number(c.debt)) return toast('المبلغ أكبر من الدين الحالي ' + fmt(c.debt), false);
    const n = (prompt('ملاحظة التسديد (اختياري):') || '').trim();
    return run(sb.rpc('add_payment', { p_customer: v, p_amount: m, p_note: n || null }), 'تم تسجيل التسديد');
  }
  if ((v = g('limit'))) {
    const c = C.find(x => String(x.id) === String(v)), n = prompt('حد الائتمان الجديد (0 = بلا حد):', c.credit_limit); if (n === null) return;
    if (!(num(n) >= 0)) return toast('قيمة غير صحيحة', false);
    return run(sb.from('customers').update({ credit_limit: num(n) }).eq('id', v), 'تم تعديل الحد');
  }
  if ((v = g('rename'))) {
    const c = C.find(x => String(x.id) === String(v)), n = prompt('الاسم الجديد للعميل:', c.name); if (n === null) return;
    if (!n.trim()) return toast('الاسم غير صحيح', false);
    return run(sb.rpc('rename_customer', { p_id: v, p_name: n }), 'تم تعديل الاسم');
  }
  if ((v = g('del'))) {
    const c = C.find(x => String(x.id) === String(v));
    if (!confirm(`حذف العميل «${c.name}» نهائياً؟\nلا يُحذف إلا عميل بلا أي حركات.`)) return;
    return run(sb.rpc('delete_customer', { p_id: v }), 'تم حذف العميل', () => { detailCustomerId = null; goTo('customers'); });
  }
  if ((v = g('void'))) {
    const why = prompt(`إلغاء الفاتورة #${v}\nسبب الإلغاء (اختياري):`); if (why === null) return;
    return run(sb.rpc('void_invoice', { p_id: Number(v), p_reason: why.trim() || null }), 'تم إلغاء الفاتورة');
  }
  if ((v = g('edit-user'))) {
    const u = U.find(x => String(x.id) === String(v)); if (!u) return;
    editingUserId = u.id;
    $('#user-form-title').textContent = 'تعديل مستخدم';
    $('#btn-save-user').textContent = 'حفظ التعديل';
    $('#btn-cancel-user').classList.remove('hidden');
    $('#u-username').value = u.username;
    $('#u-name').value = u.name;
    $('#u-role').value = u.role;
    $('#u-password').value = '';
    $('main').scrollTop = 0;
  }
});

/* ============ إدارة المستخدمين ============ */
async function adminCall(body){
  const result = await sb.functions.invoke('user-admin', { body });
  if (!result.error) return result;
  let message = result.error.message || 'خطأ غير معروف';
  try {
    const ctx = result.error.context;
    if (ctx && typeof ctx.json === 'function') {
      const detail = await ctx.json();
      if (detail?.error) message = detail.error;
      else if (detail?.message) message = detail.message;
    }
  } catch (_) {}
  if (/non-2xx/i.test(message)) {
    try {
      const ctx = result.error.context;
      if (ctx && typeof ctx.text === 'function') {
        const text = await ctx.text();
        try { const j = JSON.parse(text); message = j?.error || j?.message || message; }
        catch (_) { if (text) message = text.slice(0, 200); }
      }
    } catch (_) {}
  }
  const dict = {
    'Password should be at least 6 characters': 'كلمة المرور يجب أن تكون 6 أحرف على الأقل',
    'User already registered': 'اسم المستخدم مستخدم بالفعل',
    'A user with this email address has already been registered': 'اسم المستخدم مستخدم بالفعل',
    'Unable to validate email address': 'اسم المستخدم يحتوي أحرفاً غير صحيحة'
  };
  for (const [en, ar] of Object.entries(dict)) if (message.includes(en)) { message = ar; break; }
  return { data: { error: message }, error: null };
}

  b.disabled = false;
  if (data?.error) return toast(data.error, false);
  toast(isNew ? 'تمت إضافة المستخدم' : 'تم تعديل المستخدم');
  resetUserForm(); loadUsers();
};
$('#btn-cancel-user').onclick = resetUserForm;
</script>
</body>
</html>
