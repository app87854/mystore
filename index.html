<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5c4d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="سجل الديون">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./assets/icon-192.png">
<title>سجل الديون</title>
<style>
  :root{--ink:#1c2321;--mute:#66736f;--line:#d9dfdc;--bg:#f3f5f2;--main:#0f5c4d;--bad:#b3261e;--ok:#166534;--nav-h:64px}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;font-family:system-ui,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
  button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,select,textarea{padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;width:100%;background:#fff;color:var(--ink)}
  textarea{min-height:80px;resize:vertical}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--main);outline-offset:1px}


  /* ====== الهيكل العام ====== */
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh}

  header{background:var(--main);color:#fff;padding:10px 12px;display:flex;align-items:center;gap:8px;padding-top:calc(10px + env(safe-area-inset-top))}
  header h1{margin:0;font-size:16px;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .who{font-size:12px;opacity:.85;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
  header button{background:rgba(255,255,255,.15);padding:6px 10px;border-radius:8px;font-size:13px;color:#fff;white-space:nowrap}

  main{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px;padding-bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  body.detail main{padding-bottom:20px}

  .screen{display:flex;flex-direction:column;gap:12px}
  .screen.hidden{display:none}


  /* ====== الشريط السفلي ====== */
  #bottom-nav{
    position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);
    padding-bottom:env(safe-area-inset-bottom);
    background:#fff;border-top:1px solid var(--line);
    display:flex;justify-content:space-around;align-items:center;
    z-index:20;box-shadow:0 -2px 8px rgba(0,0,0,.04)
  }
  #bottom-nav.hidden{display:none}
  #bottom-nav button{
    flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2px;font-size:11px;color:var(--mute);padding:6px 2px
  }
  #bottom-nav button .ico{font-size:22px;line-height:1}
  #bottom-nav button.on{color:var(--main);font-weight:700}
  #bottom-nav button.on .ico{transform:scale(1.1)}


  /* ====== بطاقات ====== */
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}
  h2{font-size:15px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
  .btn{padding:11px 14px;border-radius:10px;border:1px solid var(--main);background:var(--main);color:#fff;font-weight:600}
  .btn.alt{background:#fff;color:var(--main)}
  .btn.del{background:#fff;color:var(--bad);border-color:var(--bad)}
  .btn.sm{padding:7px 12px;font-size:13px;border-radius:8px}
  .btn:disabled{opacity:.5}
  .kind-picker{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kind-btn{min-height:62px;border-radius:12px;border:2px solid;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s}
  .kind-btn .kind-sign{font-size:28px;line-height:1}
  .kind-btn.debt{color:var(--bad);border-color:var(--bad);background:#fff5f4}
  .kind-btn.settlement{color:var(--ok);border-color:var(--ok);background:#f3fff7}
  .kind-btn:not(.selected){opacity:.55;filter:saturate(.65)}
  .kind-btn.selected{opacity:1;box-shadow:0 0 0 3px rgba(15,92,77,.12)}
  .empty{color:var(--mute);padding:20px;text-align:center;font-size:14px}
  .hint{color:var(--mute);font-size:13px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .stack{display:flex;flex-direction:column;gap:10px}
  .filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  #invoice-modal{position:fixed;inset:0;background:rgba(0,0,0,.58);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
  #invoice-modal.hidden{display:none}
  #invoice-modal .card{width:min(430px,100%);max-height:90vh;overflow:auto;margin:0}
  #invoice-modal .modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
  #invoice-modal .invoice-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0;color:var(--mute);font-size:14px}
  label{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--mute)}


  /* ====== KPI ====== */
  .kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kpi>div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:12px;color:var(--mute)}
  .kpi b{display:block;font-size:20px;color:var(--ink);margin-top:6px;font-weight:800}
  .kpi b.debt{color:var(--bad)}
  .kpi b.ok{color:var(--ok)}
  .kpi>div.wide{grid-column:1/-1}


  /* ====== قائمة العملاء ====== */
  .cust-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:transform .1s}
  .cust-card:active{transform:scale(.99)}
  .cust-card .top-row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .cust-card .cname{font-size:16px;font-weight:700;word-break:break-word;flex:1}
  .cust-card .cdebt{font-size:17px;font-weight:700;white-space:nowrap}
  .cust-card .cdebt.debt{color:var(--bad)}
  .cust-card .cdebt.ok{color:var(--ok)}
  .cust-card .meta{font-size:12px;color:var(--mute)}
  .cust-card .arrow{color:var(--mute);font-size:20px;line-height:1}


  /* ====== ملف العميل ====== */
  .profile-head{background:linear-gradient(135deg,var(--main) 0%,#0a3f34 100%);color:#fff;border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}
  .profile-head .pname{font-size:22px;font-weight:800;word-break:break-word}
  .profile-head .pbal{font-size:32px;font-weight:900;line-height:1}
  .profile-head .pmeta{font-size:13px;opacity:.9}
  .profile-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
  .profile-actions .btn{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.3);color:#fff}
  .profile-actions .btn:hover{background:rgba(255,255,255,.25)}


  /* ====== بطاقات الحركات ====== */
  .tx-list{display:flex;flex-direction:column;gap:8px}
  .tx{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px;background:#fff;border-right-width:4px}
  .tx.inv{border-right-color:var(--bad)}
  .tx.pay{border-right-color:var(--ok);background:#f6fdf9}
  .tx.out,.tx.settlement{border-right-color:var(--ok);background:#f4fff8}
  .tx.void{opacity:.55;background:#f6f6f6;border-right-color:#999}
  .tx.edited{background:#fff8ed;border-right-color:#e98b18}
  #invoice-modal .card.edited{border-color:#e98b18;background:#fff8ed!important}
  .tx .t1{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14px}
  .tx .t2{display:flex;justify-content:space-between;color:var(--mute);font-size:12px}
  .tx .note{font-size:13px;background:#f8fafc;padding:6px 8px;border-radius:6px;white-space:pre-wrap;word-break:break-word}
  .tx .run{font-size:12px;color:var(--mute);border-top:1px dashed var(--line);padding-top:6px;display:flex;justify-content:space-between}
  .tx .run b{color:var(--ink)}
  .tx .actions{display:flex;gap:6px;flex-wrap:wrap;padding-top:4px}
  .tx .tag{font-size:11px;border:1px solid var(--line);border-radius:20px;padding:1px 7px;color:var(--mute)}


  /* ====== شاشة الدخول — مستوحاة من التصميم المرفق، بألوان المتجر ====== */
  #login{position:fixed;inset:0;background:linear-gradient(145deg,#071b22 0%,#0f5c4d 100%);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
  #login .card{width:min(400px,100%);margin:0;padding:40px;background:rgba(0,0,0,.48);border:1px solid rgba(102,219,185,.2);box-shadow:0 15px 25px rgba(0,0,0,.45);border-radius:10px}
  #login h2{margin:0 0 30px;padding:0;color:#fff;text-align:center;font-size:22px}
  #login label{position:relative;color:#fff;display:block;margin:0 0 28px}
  #login label[style]{margin-top:0!important}
  #login input{width:100%;padding:10px 0;font-size:16px;color:#fff;margin-top:5px;margin-bottom:0;border:none;border-bottom:1px solid rgba(255,255,255,.75);outline:none;background:transparent;border-radius:0}
  #login input:focus{outline:none;border-bottom-color:#66dbb9;box-shadow:0 1px 0 #66dbb9}
  #login #btn-login{position:relative;display:block;width:100%;padding:12px 20px;margin-top:8px;background:transparent;color:#66dbb9;border:1px solid #66dbb9;border-radius:5px;letter-spacing:2px;transition:.25s;box-shadow:0 0 8px rgba(102,219,185,.18)}
  #login #btn-login:hover,#login #btn-login:focus{background:#66dbb9;color:#06251e;box-shadow:0 0 8px #66dbb9,0 0 24px rgba(102,219,185,.65);outline:none}


  /* ====== التنبيه ====== */
  #toast{position:fixed;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:11px 20px;border-radius:10px;color:#fff;display:none;z-index:60;max-width:calc(100% - 32px);text-align:center;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
  body.detail #toast{bottom:calc(16px + env(safe-area-inset-bottom))}
  #toast.ok{background:var(--ok);display:block}
  #toast.err{background:var(--bad);display:block}
  .hidden{display:none!important}

  /* ====== كشف الحساب المطبوع ====== */
  .print-only{display:none}
  @media print{
    @page{size:A4 portrait;margin:12mm}
    html,body{height:auto;overflow:visible;background:#fff}
    body > *:not(#print-area){display:none!important}
    #print-area{display:block!important;background:#fff;color:#111;font-family:Cairo,Tahoma,Arial,sans-serif;direction:rtl;font-size:11px;line-height:1.45}
    #print-area *{box-shadow:none!important}
    .print-head{display:flex;justify-content:space-between;align-items:center;gap:16px;background:var(--main);color:#fff;border-radius:8px;padding:10px 14px;margin-bottom:10px;print-color-adjust:exact;-webkit-print-color-adjust:exact}
    .print-store{font-size:20px;font-weight:800}
    .print-title{font-size:18px;font-weight:800}
    .print-meta{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-bottom:10px}
    .print-meta div{border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fff}
    .print-meta b{font-weight:800;color:var(--main)}
    .print-table{width:100%;border-collapse:collapse;table-layout:fixed}
    .print-table th,.print-table td{border:1px solid var(--line);padding:5px 4px;vertical-align:top;word-break:break-word}
    .print-table thead th{background:var(--main);color:#fff;font-weight:800;print-color-adjust:exact;-webkit-print-color-adjust:exact}
    .print-table tbody tr:nth-child(even){background:#eef4f1}
    .print-table th:nth-child(1),.print-table td:nth-child(1){width:20%}
    .print-table th:nth-child(2),.print-table td:nth-child(2){width:30%}
    .print-table th:nth-child(3),.print-table td:nth-child(3){width:13%;text-align:center}
    .print-table th:nth-child(4),.print-table td:nth-child(4){width:14%;text-align:center}
    .print-table th:nth-child(5),.print-table td:nth-child(5){width:12%;text-align:center}
    .print-table th:nth-child(6),.print-table td:nth-child(6){width:11%;text-align:center}
    .print-debit{color:var(--bad);font-weight:800}
    .print-credit{color:var(--ok);font-weight:800}
    .print-void td{color:#6b7280;text-decoration:line-through}
    .print-total{margin:14px 0 0 auto;width:240px;border:2px solid var(--main);border-radius:10px;overflow:hidden;text-align:center}
    .print-total .t{background:var(--main);color:#fff;font-weight:800;padding:7px;print-color-adjust:exact;-webkit-print-color-adjust:exact}
    .print-total .v{font-size:22px;font-weight:900;padding:10px;color:var(--main);direction:ltr}
    .print-sign{display:flex;justify-content:space-between;gap:30px;margin-top:35px;padding-top:10px}
    .print-sign span{display:block;border-top:1px solid #555;width:35%;text-align:center;padding-top:5px}
    .print-stamp{width:35%;max-width:45mm;height:auto;print-color-adjust:exact;-webkit-print-color-adjust:exact}
    .print-empty{text-align:center;border:1px dashed var(--line);padding:30px;margin:20px 0;border-radius:8px}
  }
</style>
</head>
<body>


<div id="login"><div class="card">
  <h2>تسجيل الدخول</h2>
  <label>اسم المستخدم<input id="username" autocomplete="username"></label>
  <label style="margin-top:10px">كلمة المرور<input id="pass" type="password" autocomplete="current-password"></label>
  <button id="btn-login" class="btn" style="width:100%;margin-top:14px">دخول</button>
</div></div>


<div id="app" class="hidden">
  <header>
    <button id="btn-back" class="hidden">→</button>
    <h1 id="screen-title">الإحصائيات</h1>
    <span class="who" id="me"></span>
    <button id="btn-out">خروج</button>
  </header>


  <main>
    <!-- ==== شاشة 1: الإحصائيات ==== -->
    <section id="screen-stats" class="screen">
      <div class="kpi" id="kpi"></div>
      <div class="card">
        <h2>آخر الحركات</h2>
        <div class="filters">
          <label>العميل<select id="feed-customer"><option value="">كل العملاء</option></select></label>
          <label>النوع<select id="feed-type">
            <option value="">كل الحركات</option>
            <option value="invoice">فواتير فقط</option>
            <option value="disbursement">فواتير سداد فقط</option>
            <option value="payment">تسديدات فقط</option>
          </select></label>
          <label>الفترة<select id="feed-days">
            <option value="0">الكل</option><option value="1">اليوم</option>
            <option value="7">آخر 7 أيام</option><option value="30">آخر 30 يوم</option>
            <option value="90">آخر 90 يوم</option>
          </select></label>
          <label>تاريخ محدد<input id="feed-date" type="date"></label>
        </div>
        <div class="hint" id="feed-summary"></div>
        <div class="tx-list" id="recent-tx"></div>
      </div>
      <div class="card">
        <h2>أكثر المدينين</h2>
        <div class="tx-list" id="top-debtors"></div>
      </div>
    </section>


    <!-- ==== شاشة 2: فاتورة جديدة ==== -->
    <section id="screen-new" class="screen hidden">
      <div class="card">
  <h2>فاتورة جديدة</h2>
        <div class="stack">
          <label>نوع الفاتورة</label>
          <input id="inv-kind" type="hidden" value="invoice">
          <div class="kind-picker" role="group" aria-label="نوع الفاتورة">
            <button type="button" class="kind-btn debt selected" data-kind="invoice"><span class="kind-sign">+</span><span>فاتورة دين</span></button>
            <button type="button" class="kind-btn settlement" data-kind="disbursement"><span class="kind-sign">−</span><span>فاتورة سداد</span></button>
          </div>
          <label>العميل<select id="inv-customer"></select></label>
          <div class="hint" id="cust-hint"></div>
          <label>القيمة<input id="inv-amount" type="number" min="0" step="any" inputmode="decimal" placeholder="0.00"></label>
          <label>المشتريات / البيان<textarea id="inv-note" placeholder="مثال: 2 كيس سكر، 1 زيت"></textarea></label>
          <button id="btn-save" class="btn" style="padding:14px;font-size:16px">حفظ الفاتورة</button>
        </div>
      </div>
      <div class="card">
        <h2>إضافة عميل سريع</h2>
        <div class="stack">
          <label>الاسم<input id="c-name"></label>
          <label id="credit-limit-field">حد الائتمان (0 = بلا حد)<input id="c-limit" type="number" min="0" step="any" value="0" inputmode="decimal"></label>
          <button id="btn-add-c" class="btn alt">إضافة العميل</button>
        </div>
      </div>
    </section>


    <!-- ==== شاشة 3: العملاء ==== -->
    <section id="screen-customers" class="screen hidden">
      <div class="card" style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:14px">إجمالي الديون</span>
        <b id="total-debt" style="font-size:18px;color:var(--bad)">0.00</b>
      </div>
      <div class="card">
        <label>بحث عن عميل<input id="customer-search" type="search" placeholder="اكتب جزءاً من اسم العميل" autocomplete="off"></label>
      </div>
      <div class="cust-list stack" id="customers"></div>
    </section>


    <!-- ==== شاشة 4: ملف العميل ==== -->
    <section id="screen-customer" class="screen hidden">
      <div class="profile-head" id="profile-head"></div>
      <div class="card">
        <h2>كشف الحركات</h2>
        <div class="tx-list" id="customer-tx"></div>
      </div>
    </section>


    <!-- ==== شاشة 5: المستخدمون ==== -->
    <section id="screen-users" class="screen hidden">
      <div class="card">
        <h2 id="user-form-title">إضافة مستخدم</h2>
        <div class="stack">
          <label>اسم المستخدم<input id="u-username" autocomplete="off"></label>
          <label>الاسم الظاهر<input id="u-name"></label>
          <label>الدور<select id="u-role"><option value="seller">بائع</option><option value="admin">مدير</option></select></label>
          <label>كلمة المرور<input id="u-password" type="password" autocomplete="new-password" placeholder="6 أحرف على الأقل"></label>
          <button id="btn-save-user" class="btn">إضافة المستخدم</button>
          <button id="btn-cancel-user" class="btn alt hidden">إلغاء التعديل</button>
        </div>
      </div>
      <div class="card">
        <h2>المستخدمون</h2>
        <div class="tx-list" id="users"></div>
      </div>
    </section>
  </main>


  <nav id="bottom-nav">
    <button data-screen="stats" class="on"><span class="ico">📊</span>الإحصائيات</button>
    <button data-screen="new"><span class="ico">➕</span>فاتورة</button>
    <button data-screen="customers"><span class="ico">👥</span>العملاء</button>
    <button data-screen="users" id="nav-users" class="hidden"><span class="ico">⚙️</span>المستخدمون</button>
  </nav>
</div>


<div id="toast"></div>

<div id="invoice-modal" class="hidden" role="dialog" aria-modal="true">
  <div class="card">
    <div class="modal-head"><h2 id="movement-modal-title">تفاصيل الحركة</h2><button class="btn alt sm" data-close-invoice>إغلاق</button></div>
    <div id="invoice-detail"></div>
  </div>
</div>

<div id="print-area" class="print-only"></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

/* ============ التحميل والمزامنة ============ */
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
async function load(){
  if (loading) { dirty = true; return; }
  loading = true;
  let lastError = null;
  try {
    // أخطاء fetch العابرة شائعة على الهاتف عند تبدّل الشبكة؛ أعد المحاولة قبل التنبيه.
    for (let attempt = 0; attempt < 3; attempt++){
      try {
        await loadNow();
        lastError = null;
        break;
      } catch (e){
        lastError = e;
        if (attempt < 2) await wait(500 * (attempt + 1));
      }
    }
    if (lastError) toast('تعذّر الاتصال بالخادم. تحقق من الإنترنت ثم أعد المحاولة', false);
  } finally {
    loading = false;
    if (dirty) { dirty = false; load(); }
  }
}
async function loadNow(){
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) return;
  const [c, i, y, me, s] = await Promise.all([
    sb.from('customer_balances').select('*').order('name'),
    sb.from('invoices').select('id,total,note,kind,created_at,voided_at,void_reason,edited_at,customer_id,customers(name),profiles!invoices_created_by_fkey(name)').order('id',{ascending:false}).limit(200),
    sb.from('payments').select('id,amount,note,created_at,voided_at,void_reason,edited_at,customer_id,customers(name),profiles!payments_created_by_fkey(name)').order('id',{ascending:false}).limit(200),
    sb.from('profiles').select('name,role').eq('id', session.user.id).maybeSingle(),
    sb.from('store_stats').select('*').single()
  ]);
  const err = c.error || i.error || y.error || me.error || s.error;
  if (err) throw err;
  C = [...(c.data || [])].sort((a, b) => coll.compare(a.name || '', b.name || ''));
  I = i.data || []; Y = y.data || []; state = s.data || {};
  admin = me.data?.role === 'admin';
  $('#nav-users').classList.toggle('hidden', !admin);
  $('#credit-limit-field').classList.toggle('hidden', !admin);
  $('#me').textContent = (me.data?.name || '') + (admin ? ' (مدير)' : ' (بائع)');
  render();
  // إن كان ملف عميل مفتوحاً: حدّث كشفه من جديد (دون إفراغ الشاشة)
  if (detailCustomerId) loadTx(detailCustomerId);
}
function subscribe(){
  if (channel) return;
  let t; const again = () => { clearTimeout(t); t = setTimeout(load, 300); };
  channel = sb.channel('live');
  ['invoices','customers','payments'].forEach(tb =>
    channel.on('postgres_changes', { event:'*', schema:'public', table:tb }, again));
  channel.subscribe();
}


/* ============ كشف حساب العميل (يُجلب كاملاً) ============ */
// PostgREST قد يحدّ-rows لكل استجابة، فنقسم على صفحات ونقارن بعدد الصفوف الكلي
const PAGE = 1000;
async function fetchAll(table, cols, customerId){
  const out = []; let from = 0, count = null;
  for (let guard = 0; guard < 1000; guard++){
    const { data, error, count: c } = await sb.from(table)
      .select(cols, { count: 'exact' })
      .eq('customer_id', customerId)
      .order('created_at',{ascending:true}).order('id',{ascending:true})
      .range(from, from + PAGE - 1);
    if (error) throw error;
    if (c != null) count = c;
    out.push(...(data || []));
    from += (data || []).length;
    if (!data || !data.length) break;
    if (count != null ? from >= count : data.length < PAGE) break;
  }
  return { rows: out, complete: count == null || out.length >= count };
}

// ترتيب حتمي: الزمن، ثم الفاتورة قبل التسديد، ثم المعرّف.
// (المعرّفات من جدولين مختلفين فلا يصحّ خلطها في مقارنة واحدة)
function cmpStatement(a, b){
  const t = new Date(a.d) - new Date(b.d);
  if (t) return t;
  if (a.src !== b.src) return a.src === 'inv' ? -1 : 1;
  return (a.id || 0) - (b.id || 0);
}

/* مصدر واحد للحقيقة: يبني حركات العميل مرتّبة، مع الرصيد بعد كل حركة
   والإجماليات والرصيد النهائي. تستخدمه الشاشة والطباعة معاً، فلا تختلفان أبداً. */
function buildStatement(invRows, payRows){
  const rows = [
    ...(invRows || []).map(r => {
      const voided = Boolean(r.voided_at);
      return {
        src: 'inv', id: r.id, d: r.created_at, voided, edited: Boolean(r.edited_at),
        type: voided ? 'void' : (r.kind === 'disbursement' ? 'settlement' : 'inv'),
        title: (r.kind === 'disbursement' ? 'فاتورة سداد' : 'فاتورة دين') + ' #' + r.id + (voided ? ' (ملغاة)' : ''),
        note: voided && r.void_reason
          ? (r.note ? r.note + ' — سبب الإلغاء: ' + r.void_reason : 'سبب الإلغاء: ' + r.void_reason)
          : r.note,
        by: r.profiles?.name,
        debit: voided || r.kind === 'disbursement' ? 0 : Number(r.total) || 0,
        credit: voided || r.kind !== 'disbursement' ? 0 : Number(r.total) || 0
      };
    }),
    ...(payRows || []).map(r => ({
      src: 'pay', id: r.id, d: r.created_at, voided: Boolean(r.voided_at), edited: Boolean(r.edited_at),
      type: r.voided_at ? 'void' : 'pay',
      title: 'إيصال قبض #' + r.id + (r.voided_at ? ' (ملغى)' : ''),
      note: r.voided_at && r.void_reason ? (r.note ? r.note + ' — سبب الإلغاء: ' + r.void_reason : 'سبب الإلغاء: ' + r.void_reason) : r.note,
      by: r.profiles?.name, debit: 0, credit: r.voided_at ? 0 : (Number(r.amount) || 0)
    }))
  ].sort(cmpStatement);

  let running = 0, totalDebit = 0, totalCredit = 0;
  for (const r of rows){
    r.balance = Math.round((running + r.debit - r.credit) * 100) / 100;
    running = r.balance;
    if (!r.voided){ totalDebit += r.debit; totalCredit += r.credit; }
  }
  return { rows, totalDebit: Math.round(totalDebit*100)/100, totalCredit: Math.round(totalCredit*100)/100, finalBalance: running };
}

async function loadTx(id){
  try {
    const [i, y] = await Promise.all([
      fetchAll('invoices', TX_INV, id),
      fetchAll('payments', TX_PAY, id)
    ]);
    if (!i.complete || !y.complete) toast('كشف الحساب أطول من الحد المسموح — قد ينقص جزء من الحركات', false);
    TX[String(id)] = { st: buildStatement(i.rows, y.rows) };
  } catch (e){
    return toast('تعذّر تحميل كشف الحساب: ' + (e.message || e), false);
  }
  if (String(detailCustomerId) === String(id)) renderCustomerDetail(id);
}

  history.pushState({ screen: 'customer' }, '');
  detailCustomerId = id;
  renderCustomerDetail(id);
  goTo('customer');
  loadTx(id);
}

function renderFeedFilters(){

  sel.value = keep;
}

function feedRange(){
  const days = Number($('#feed-days')?.value) || 0, selected = $('#feed-date')?.value;
  let from = null, to = null;
  if (selected){
    from = new Date(selected + 'T00:00:00');
    to = new Date(from); to.setDate(to.getDate() + 1);
  } else if (days > 0){
    from = new Date(); from.setHours(0, 0, 0, 0);
    from.setDate(from.getDate() - (days - 1));
  }
  return { from, to };
}

function renderFeed(){
  const box = $('#recent-tx');
  if (!box) return;
  const customer = $('#feed-customer')?.value || '', type = $('#feed-type')?.value || '';
  const { from, to } = feedRange();
  const inRange = d => { const date = new Date(d); return (!from || date >= from) && (!to || date < to); };
  const rows = [
    ...(type === 'payment' ? [] : I.map(r => ({
      src: 'inv', k: r.voided_at ? 'void' : (r.kind === 'disbursement' ? 'settlement' : 'inv'), kind: r.kind, id: r.id, edited: Boolean(r.edited_at), d: r.created_at,
      id: r.id, cid: r.customer_id, who: r.customers?.name, amt: Number(r.total), by: r.profiles?.name,
      title: (r.kind === 'disbursement' ? 'فاتورة سداد' : 'فاتورة دين') + ' #' + r.id
    }))),
    ...(type === 'invoice' || type === 'disbursement' ? [] : Y.map(r => ({
      src: 'pay', k: r.voided_at ? 'void' : 'pay', id: r.id, edited: Boolean(r.edited_at), d: r.created_at, cid: r.customer_id, who: r.customers?.name,
      amt: Number(r.amount), by: r.profiles?.name, title: 'إيصال قبض #' + r.id + (r.voided_at ? ' (ملغى)' : '')
    })))
  ].filter(r => (!customer || r.cid === customer) &&
    (!type || (type === 'payment' ? r.src === 'pay' : type === 'invoice' ? r.kind === 'invoice' : type === 'disbursement' ? r.kind === 'disbursement' : true)) && inRange(r.d))
   .sort((a, b) => new Date(b.d) - new Date(a.d));
  const summary = $('#feed-summary');
  if (summary) summary.textContent = `عدد الحركات المعروضة: ${rows.length} · ${from ? (to ? 'التاريخ المحدد' : 'من ' + from.toLocaleDateString('ar')) : 'كل التواريخ'}`;
  box.innerHTML = rows.length ? rows.map(r => txCardHTML(r)).join('') : '<div class="empty">لا توجد حركات مطابقة.</div>';
}

['#feed-customer', '#feed-type'].forEach(s => $(s).onchange = renderFeed);

function renderCustomerDetail(id){
  const c = C.find(x => String(x.id) === String(id));
  if (!c) { leaveCustomer(); return; }
  const debt = Number(c.debt);
  const lim = Number(c.credit_limit);


  $('#profile-head').innerHTML = `
    <div class="pname">${esc(c.name)}</div>
    <div class="pbal">${fmt(debt)}</div>
    <div class="pmeta">${lim > 0 ? `حد الائتمان: ${fmt(lim)} · المتاح: ${fmt(lim - debt)}` : 'بلا حد ائتمان'}</div>
    <div class="profile-actions">
      <button class="btn" data-print-statement="${c.id}">طباعة كشف الحساب</button>
      ${debt > 0 ? `<button class="btn" data-pay="${c.id}">تسديد دفعة</button>` : ''}
      ${admin ? `<button class="btn" data-rename="${c.id}">تعديل الاسم</button>` : ''}
      ${admin ? `<button class="btn" data-limit="${c.id}">تعديل الحد</button>` : ''}
      ${admin ? `<button class="btn" style="background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3)" data-del="${c.id}">حذف العميل</button>` : ''}
    </div>`;


  // الكشف يُقرأ من الجلب المنفصل؛ لا يُعرض إلا كاملاً حتى لا يخطئ الرصيد
  const src = TX[String(id)];
  if (!src) {
    $('#customer-tx').innerHTML = '<div class="empty">جارٍ تحميل كشف الحساب…</div>';
    return;
  }

  $('#customer-tx').innerHTML = src.st.rows.length ? src.st.rows.map(r => {
    const amt = r.type === 'pay' || r.type === 'settlement'
      ? `<span style="color:var(--ok)">− ${fmt(r.credit)}</span>`
      : r.voided ? '<span class="hint">ملغاة</span>' : `<span style="color:var(--bad)">+ ${fmt(r.debit)}</span>`;
    return `<div class="tx ${r.type === 'pay' ? 'pay' : r.voided ? 'void' : r.type} ${r.edited ? 'edited' : ''}">
      <div class="t1"><span>${esc(r.title)}</span><span>${amt}</span></div>
      <div class="t2"><span>${esc(dt(r.d))}</span><span>${esc(r.by || '—')}</span></div>
      ${r.note ? `<div class="note">${esc(r.note)}</div>` : ''}
      <div class="run"><span>الرصيد بعد الحركة</span><b>${fmt(r.balance)}</b></div>
      ${(r.type === 'pay' || r.type === 'settlement' || (r.src === 'inv' && !r.voided) || (r.src === 'pay' && !r.voided)) ? `<div class="actions">
        ${r.type === 'pay' || r.type === 'settlement' ? `<button class="btn alt sm" data-receipt="${r.src}:${r.id}">طباعة الإيصال</button>` : ''}
        ${r.src === 'pay' && !r.voided && admin ? `<button class="btn alt sm" data-edit-payment="${r.id}">تعديل التسديد</button>` : ''}
        ${r.src === 'pay' && !r.voided ? `<button class="btn del sm" data-void-payment="${r.id}">إلغاء التسديد</button>` : ''}
        ${r.src === 'inv' && r.edited ? '<span class="tag">معدلة</span>' : ''}
        ${r.src === 'inv' && !r.voided ? `<button class="btn del sm" data-void="${r.id}">إلغاء الفاتورة</button>` : ''}
      </div>` : ''}
    </div>`;
  }).join('')
    : '<div class="empty">لا توجد حركات لهذا العميل.</div>';
}

/* ============ طباعة كشف الحساب (جلب كامل مستقل عن القوائم المختصرة) ============ */
async function printStatement(customerId, btn){
  btn = btn || document.querySelector(`[data-print-statement="${customerId}"]`);
  const area = $('#print-area');
  if (btn) { btn.disabled = true; btn.textContent = 'جارٍ التجهيز…'; }
  area.innerHTML = '<div class="empty">جارٍ تجهيز كشف الحساب…</div>';
  try {
    const [cRes, iRes, yRes] = await Promise.all([
      sb.from('customers').select('id,name,phone').eq('id', customerId).single(),
      fetchAll('invoices', TX_INV, customerId),
      fetchAll('payments', TX_PAY, customerId)
    ]);
    if (cRes.error) { area.innerHTML = ''; return toast('تعذّر تجهيز كشف الحساب: ' + cRes.error.message, false); }
    if (!cRes.data)  { area.innerHTML = ''; return toast('العميل غير موجود', false); }

    // كشف ناقص وثيقة مالية ناقصة: لا نطبع شيئاً. يُعاد المحاولة بزر الطباعة.
    if (!iRes.complete || !yRes.complete){
      area.innerHTML = '';
      return toast('تعذّر جلب كشف الحساب كاملاً (تجاوز حدّ الاستجابة) — لم يُطبع شيء', false);
    }

    // نفس الدالة التي تبني كشف الشاشة — فلا يمكن أن يختلف الرقمان
    const st = buildStatement(iRes.rows, yRes.rows);
    const customer = cRes.data;
    window.__statementPreviousTitle = document.title;
    document.title = `${customer.name} - كشف حساب`;

    // الأعمدة: اسم العميل | الملاحظة | القيمة | التاريخ | البائع (+ الرصيد المتحرك)
    // النوع والقيمة والأثر على الرصيد مأخوذة كما هي من buildStatement دون إعادة حساب
    const tableRows = st.rows.map(r => {
      const value = r.voided ? '—'
        : r.type === 'pay' ? `<span class="print-credit">− ${fmt(r.credit)}</span>`
        : `<span class="print-debit">+ ${fmt(r.debit)}</span>`;
      return `<tr class="${r.voided ? 'print-void' : ''}">
        <td>${esc(customer.name)}</td>
        <td>${esc(r.title + (r.note ? ' — ' + r.note : ''))}</td>
        <td>${value}</td>
        <td>${esc(new Date(r.d).toLocaleDateString('ar'))}</td>
        <td>${esc(r.by || '—')}</td>
        <td>${fmt(r.balance)}</td>
      </tr>`;
    }).join('');
    const finalBalance = st.finalBalance;
    const printedAt = new Date().toLocaleString('ar');
    area.innerHTML = `
      <div class="print-head"><div class="print-store">${esc(STORE_NAME)}</div><div class="print-title">كشف حساب</div></div>
      <div class="print-meta">
        <div>العميل: <b>${esc(customer.name)}</b></div>
        <div>الهاتف: <b>${esc(customer.phone || '—')}</b></div>
        <div>الرصيد الحالي: <b>${fmt(finalBalance)}</b></div>
        <div>تاريخ الطباعة: <b>${esc(printedAt)}</b></div>
      </div>
      ${st.rows.length ? `<table class="print-table"><thead><tr><th>اسم العميل</th><th>الملاحظة</th><th>القيمة</th><th>التاريخ</th><th>البائع</th><th>الرصيد</th></tr></thead><tbody>${tableRows}</tbody></table>` : '<div class="print-empty">لا توجد حركات</div>'}
      <div class="print-total"><div class="t">المجموع النهائي</div><div class="v">${fmt(finalBalance)}</div></div>
      <div class="print-sign"><img class="print-stamp" src="stamp.png" alt="ختم المحل"><span>توقيع العميل</span></div>`;
    // نؤجّل الطباعة إطارين حتى يكتمل تخطيط الجدول (يمنع صفحة أولى فارغة)،
    // ولا نطبع قبل تحميل صورة الختم حتى لا تخرج فارغة (مع مهلة أمان)
    const stampImg = area.querySelector('.print-stamp');
    let printFired = false;
    const goPrint = () => {
      if (printFired) return; printFired = true;
      requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(() => window.print(), 30)));
    };
    if (stampImg && !stampImg.complete) {
      stampImg.onload = stampImg.onerror = goPrint;
      setTimeout(goPrint, 2000);
    } else goPrint();
  } catch (err) {
    area.innerHTML = '';
    toast('تعذّر تجهيز كشف الحساب: ' + (err.message || err), false);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'طباعة كشف الحساب'; }
  }
}
window.addEventListener('afterprint', () => {
  $('#print-area').innerHTML = '';
  if (window.__statementPreviousTitle) {
    document.title = window.__statementPreviousTitle;
    delete window.__statementPreviousTitle;
  }
});


/* ---- إيصال قبض / فاتورة سداد (من بيانات الكشف المحمّل، دون جلب إضافي) ---- */
function printReceipt(src, id){
  const cid = String(detailCustomerId);
  const c = C.find(x => String(x.id) === cid);
  const r = TX[cid]?.st.rows.find(x => x.src === src && String(x.id) === String(id));
  if (!c || !r || r.voided) return toast('تعذّر تجهيز الإيصال', false);
  const isIn = r.src === 'pay' || r.type === 'settlement';
  const title = r.type === 'settlement' ? 'فاتورة سداد' : 'إيصال قبض';
  const area = $('#print-area');
  window.__statementPreviousTitle = document.title;
  document.title = `${c.name} - ${title} ${r.id}`;
  area.innerHTML = `
    <div class="print-head"><div class="print-store">${esc(STORE_NAME)}</div><div class="print-title">${title}</div></div>
    <div class="print-meta">
      <div>الرقم: <b>${r.id}</b></div>
      <div>التاريخ: <b>${esc(new Date(r.d).toLocaleString('ar'))}</b></div>
      <div>العميل: <b>${esc(c.name)}</b></div>
      <div>البائع: <b>${esc(r.by || '—')}</b></div>
      <div>الرصيد بعد الحركة: <b>${fmt(r.balance)}</b></div>
      ${r.note ? `<div style="grid-column:1/-1;white-space:pre-wrap">البيان: ${esc(r.note)}</div>` : ''}
    </div>
    <div class="print-total"><div class="t">المبلغ</div><div class="v">${fmt(isIn ? r.credit : r.debit)}</div></div>
    <p>${isIn ? 'خُصم المبلغ المذكور أعلاه من دين العميل.' : 'أضيف المبلغ المذكور أعلاه إلى دين العميل.'}</p>
    <div class="print-sign"><img class="print-stamp" src="stamp.png" alt="ختم المحل"><span>توقيع العميل</span></div>`;
  const img = area.querySelector('.print-stamp');
  let fired = false;
  const go = () => { if (fired) return; fired = true; requestAnimationFrame(() => requestAnimationFrame(() => setTimeout(() => window.print(), 30))); };
  if (img && !img.complete) { img.onload = img.onerror = go; setTimeout(go, 2000); } else go();
}


/* ---- بطاقة حركة مختصرة (للإحصائيات) ---- */
function txCardHTML(r){
  const amtClass = r.k === 'pay' || r.k === 'settlement' ? 'style="color:var(--ok)"' : r.k === 'void' ? '' : 'style="color:var(--bad)"';
  const sign = r.k === 'pay' || r.k === 'settlement' ? '− ' : r.k === 'void' ? '' : '+ ';
  const clickable = r.id != null;
  const seller = r.k !== 'pay' ? ` · البائع: ${esc(r.by || '—')}` : '';
  const target = r.src === 'pay' ? 'data-open-payment' : 'data-open-invoice';
  return `<div class="tx ${r.k} ${r.edited ? 'edited' : ''}" ${clickable ? `${target}="${r.id}" style="cursor:pointer"` : ''}>
    <div class="t1"><span>${esc(r.who || '—')}</span><span ${amtClass}>${sign}${fmt(r.amt)}</span></div>
    <div class="t2"><span>${esc(r.title)}${seller}</span><span>${esc(dt(r.d))}</span></div>
  </div>`;
}


/* ============ النقر على البطاقات والأزرار ============ */
document.addEventListener('click', e => {
  if (e.target.closest('[data-close-invoice]') || e.target === $('#invoice-modal')) return closeInvoice();
  const invoiceCard = e.target.closest('[data-open-invoice]');
  if (invoiceCard && !e.target.closest('button')) return openInvoice(invoiceCard.dataset.openInvoice);
  const paymentCard = e.target.closest('[data-open-payment]');
  if (paymentCard && !e.target.closest('button')) return openPayment(paymentCard.dataset.openPayment);
  const open = e.target.closest('[data-open-customer]');
  if (open && !e.target.closest('button')) return openCustomer(open.dataset.openCustomer);

  const g = a => e.target.closest(`[data-${a}]`)?.dataset[a.replace(/-./g, m => m[1].toUpperCase())];
  let v;
  if ((v = g('print-statement'))) return printStatement(v, e.target.closest('[data-print-statement]'));
  if ((v = g('receipt'))) { const [s, id] = v.split(':'); return printReceipt(s, id); }
  if ((v = g('pay'))) {
    const c = C.find(x => String(x.id) === String(v));
    const a = prompt(`المبلغ المسدَّد (الدين الحالي ${fmt(c.debt)}):`, c.debt); if (a === null) return;
    const m = num(a);
    if (!(m > 0)) return toast('أدخل مبلغاً صحيحاً', false);
    if (m > Number(c.debt)) return toast('المبلغ أكبر من الدين الحالي ' + fmt(c.debt), false);
    const n = (prompt('ملاحظة التسديد (اختياري):') || '').trim();
    return run(sb.rpc('add_payment', { p_customer: v, p_amount: m, p_note: n || null }), 'تم تسجيل التسديد');
  }
  if ((v = g('limit'))) {
    const c = C.find(x => String(x.id) === String(v)), n = prompt('حد الائتمان الجديد (0 = بلا حد):', c.credit_limit); if (n === null) return;
    if (!(num(n) >= 0)) return toast('قيمة غير صحيحة', false);
    return run(sb.from('customers').update({ credit_limit: num(n) }).eq('id', v), 'تم تعديل الحد');
  }
  if ((v = g('rename'))) {
    const c = C.find(x => String(x.id) === String(v)), n = prompt('الاسم الجديد للعميل:', c.name); if (n === null) return;
    if (!n.trim()) return toast('الاسم غير صحيح', false);
    return run(sb.rpc('rename_customer', { p_id: v, p_name: n }), 'تم تعديل الاسم');
  }
  if ((v = g('del'))) {
    const c = C.find(x => String(x.id) === String(v));
    if (!confirm(`حذف العميل «${c.name}» نهائياً؟\nلا يُحذف إلا عميل بلا أي حركات.`)) return;
    return run(sb.rpc('delete_customer', { p_id: v }), 'تم حذف العميل', leaveCustomer);
  }
  if ((v = g('void'))) {
    const why = prompt(`إلغاء الفاتورة #${v}\nسبب الإلغاء (اختياري):`); if (why === null) return;
    if (!confirm(`تأكيد إلغاء الفاتورة #${v}؟\nسيعاد حساب رصيد العميل بناءً على ذلك.`)) return;
    return run(sb.rpc('void_invoice', { p_id: Number(v), p_reason: why.trim() || null }), 'تم إلغاء الفاتورة', closeInvoice);
  }
  if ((v = g('save-invoice'))) {
    const m = num($('#edit-invoice-amount')?.value);
    if (!(m > 0)) return toast('القيمة غير صحيحة', false);
    const note = $('#edit-invoice-note')?.value || '';
    if (!confirm(`تأكيد حفظ تعديل الفاتورة #${v}؟`)) return;
    return run(sb.rpc('update_debt_invoice', { p_id: Number(v), p_amount: m, p_note: note.trim() || null }), 'تم تعديل الفاتورة', closeInvoice);
  }
  if ((v = g('edit-payment'))) return openPayment(v);
  if ((v = g('void-payment'))) {
    const why = prompt(`إلغاء التسديد #${v}\nسبب الإلغاء (اختياري):`); if (why === null) return;
    if (!confirm(`تأكيد إلغاء التسديد #${v}؟\nسيعاد حساب رصيد العميل بناءً على ذلك.`)) return;
    return run(sb.rpc('void_payment', { p_id: Number(v), p_reason: why.trim() || null }), 'تم إلغاء التسديد', closeInvoice);
  }
  if ((v = g('save-payment'))) {
    const m = num($('#edit-payment-amount')?.value);
    if (!(m > 0)) return toast('القيمة غير صحيحة', false);
    const note = $('#edit-payment-note')?.value || '';
    if (!confirm(`تأكيد حفظ تعديل التسديد #${v}؟`)) return;
    return run(sb.rpc('update_payment', { p_id: Number(v), p_amount: m, p_note: note.trim() || null }), 'تم تعديل التسديد', closeInvoice);
  }
  if ((v = g('edit-user'))) {
    const u = U.find(x => String(x.id) === String(v)); if (!u) return;
    editingUserId = u.id;
    $('#user-form-title').textContent = 'تعديل مستخدم';
    $('#btn-save-user').textContent = 'حفظ التعديل';
    $('#btn-cancel-user').classList.remove('hidden');
    $('#u-username').value = u.username;
    $('#u-name').value = u.name;
    $('#u-role').value = u.role;
    $('#u-password').value = '';
    $('main').scrollTop = 0;
  }
});


/* ============ الحفظ والعمل ============ */
async function run(p, okMsg, after){
  const { error } = await p;
  if (error) return toast(error.message, false);
  toast(okMsg);
  await load();
  if (typeof after === 'function') after();
}


$('#btn-save').onclick = async () => {
  const customer = $('#inv-customer').value, amount = num($('#inv-amount').value);
  if (!customer) return toast('اختر العميل', false);
  if (!(amount > 0)) return toast('أدخل قيمة صحيحة', false);
  const b = $('#btn-save'); b.disabled = true;
  const kind = $('#inv-kind').value;
  const { data, error } = await sb.rpc('create_debt_invoice', {
    p_customer: customer, p_amount: amount, p_note: $('#inv-note').value, p_kind: kind
  });
  b.disabled = false;
  if (error) return toast(error.message, false);
  toast((kind === 'disbursement' ? 'تم حفظ فاتورة السداد رقم ' : 'تم حفظ فاتورة الدين رقم ') + data);
  $('#inv-amount').value = ''; $('#inv-note').value = '';
  load();
};


$('#btn-add-c').onclick = async () => {
  const name = $('#c-name').value.trim(), credit_limit = num($('#c-limit').value) || 0;
  if (!name) return toast('أدخل اسم العميل', false);
  const { error } = await sb.from('customers').insert({ name, credit_limit });
  if (error) return toast(error.message, false);
  $('#c-name').value = ''; $('#c-limit').value = 0;
  toast('تمت إضافة العميل'); load();
};


/* ============ إدارة المستخدمين ============ */
async function adminCall(body){
  const result = await sb.functions.invoke('user-admin', { body });
  if (!result.error) return result;
  let message = result.error.message || 'خطأ غير معروف';
  try {
    const ctx = result.error.context;
    if (ctx && typeof ctx.json === 'function') {
      const detail = await ctx.json();
      if (detail?.error) message = detail.error;
      else if (detail?.message) message = detail.message;
    }
  } catch (_) {}
  if (/non-2xx/i.test(message)) {
    try {
      const ctx = result.error.context;
      if (ctx && typeof ctx.text === 'function') {
        const text = await ctx.text();
        try { const j = JSON.parse(text); message = j?.error || j?.message || message; }
        catch (_) { if (text) message = text.slice(0, 200); }
      }
    } catch (_) {}
  }
  const dict = {
    'Password should be at least 6 characters': 'كلمة المرور يجب أن تكون 6 أحرف على الأقل',
    'User already registered': 'اسم المستخدم مستخدم بالفعل',
    'A user with this email address has already been registered': 'اسم المستخدم مستخدم بالفعل',
    'Unable to validate email address': 'اسم المستخدم يحتوي أحرفاً غير صحيحة'
  };
  for (const [en, ar] of Object.entries(dict)) if (message.includes(en)) { message = ar; break; }
  return { data: { error: message }, error: null };
}


async function loadUsers(){
  if (!admin) return;
  const { data } = await adminCall({ action: 'list' });
  if (data?.error) return toast(data.error, false);
  U = data.users || [];
  $('#users').innerHTML = U.length ? U.map(u => `
    <div class="cust-card" style="cursor:default">
      <div class="top-row">
        <div style="flex:1;min-width:0">
          <div class="cname">${esc(u.name || u.username)}</div>
          <div class="meta">@${esc(u.username)} · ${u.role === 'admin' ? 'مدير' : 'بائع'}</div>
        </div>
        <button class="btn alt sm" data-edit-user="${u.id}">تعديل</button>
      </div>
    </div>`).join('')
    : '<div class="empty">لا يوجد مستخدمون.</div>';
}
function resetUserForm(){
  editingUserId = null;
  $('#user-form-title').textContent = 'إضافة مستخدم';
  $('#btn-save-user').textContent = 'إضافة المستخدم';
  $('#btn-cancel-user').classList.add('hidden');
  $('#u-username').value = ''; $('#u-name').value = ''; $('#u-role').value = 'seller'; $('#u-password').value = '';
}
$('#btn-save-user').onclick = async () => {
  const password = $('#u-password').value;
  const username = $('#u-username').value.trim();
  const isNew = !editingUserId;

  if (!/^[a-zA-Z0-9_\u0600-\u06FF]{3,}$/.test(username))
    return toast('اسم المستخدم 3 أحرف على الأقل (بدون مسافات)', false);
  if (password && password.length < 6)
    return toast('كلمة المرور يجب أن تكون 6 أحرف على الأقل', false);
  if (isNew && !password)
    return toast('أدخل كلمة المرور', false);

  const body = { action: isNew ? 'create' : 'update', username,
    name: $('#u-name').value.trim(), role: $('#u-role').value, password };
  if (!isNew) body.id = editingUserId;
  const b = $('#btn-save-user'); b.disabled = true;
  const { data } = await adminCall(body);
  b.disabled = false;
  if (data?.error) return toast(data.error, false);
  toast(isNew ? 'تمت إضافة المستخدم' : 'تم تعديل المستخدم');
  resetUserForm(); loadUsers();
};
$('#btn-cancel-user').onclick = resetUserForm;
