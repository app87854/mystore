<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5c4d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="سجل الديون">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./assets/icon-192.png">
<title>سجل الديون</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>


<div id="login"><div class="card">
  <h2>تسجيل الدخول</h2>
  <label>اسم المستخدم<input id="username" autocomplete="username"></label>
  <label style="margin-top:10px">كلمة المرور<input id="pass" type="password" autocomplete="current-password"></label>
  <button id="btn-login" class="btn" style="width:100%;margin-top:14px">دخول</button>
</div></div>


<div id="app" class="hidden">
  <header>
    <button id="btn-back" class="hidden">→</button>
    <h1 id="screen-title">الإحصائيات</h1>
    <span class="who" id="me"></span>
    <button id="btn-out">خروج</button>
  </header>


  <main>
    <!-- ==== شاشة 1: الإحصائيات ==== -->
    <section id="screen-stats" class="screen">
      <div class="kpi" id="kpi"></div>
      <div class="card hidden" id="push-settings">
        <h2>إشعارات المدير</h2>
        <div class="row2" style="align-items:center">
          <div class="hint" id="push-status" aria-live="polite">إشعارات المتجر اختيارية لهذا الجهاز.</div>
          <button id="btn-push-toggle" class="btn alt sm" type="button">تفعيل الإشعارات</button>
        </div>
      </div>
      <div class="card">
        <h2>آخر الحركات</h2>
        <div class="filters">
          <label>العميل<select id="feed-customer"><option value="">كل العملاء</option></select></label>
          <label>النوع<select id="feed-type">
            <option value="">كل الحركات</option>
            <option value="invoice">فواتير فقط</option>
            <option value="disbursement">فواتير سداد فقط</option>
            <option value="payment">تسديدات فقط</option>
          </select></label>
          <label>الفترة<select id="feed-days">
            <option value="0">الكل</option><option value="1">اليوم</option>
            <option value="7">آخر 7 أيام</option><option value="30">آخر 30 يوم</option>
            <option value="90">آخر 90 يوم</option>
          </select></label>
          <label>تاريخ محدد<input id="feed-date" type="date"></label>
        </div>
        <div class="hint" id="feed-summary"></div>
        <div class="tx-list" id="recent-tx"></div>
      </div>
      <div class="card">
        <h2>أكثر المدينين</h2>
        <div class="tx-list" id="top-debtors"></div>
      </div>
    </section>


    <!-- ==== شاشة 2: فاتورة جديدة ==== -->
    <section id="screen-new" class="screen hidden">
      <div class="card">
  <h2>فاتورة جديدة</h2>
        <div class="stack">
          <label>نوع الفاتورة<select id="inv-kind"><option value="invoice">فاتورة دين</option><option value="disbursement">فاتورة سداد</option></select></label>
          <div class="customer-picker" id="invoice-customer-picker">
            <label for="inv-customer-search">العميل</label>
            <input id="inv-customer-search" type="search" placeholder="ابحث باسم العميل أو رقمه" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="inv-customer-options">
            <input id="inv-customer" type="hidden" value="">
            <div id="inv-customer-options" class="customer-options hidden" role="listbox" aria-label="نتائج العملاء"></div>
          </div>
          <div class="hint" id="cust-hint"></div>
          <label>القيمة<input id="inv-amount" type="text" inputmode="none" dir="ltr" autocomplete="off" placeholder="0.00" aria-label="قيمة الفاتورة"></label>
          <div class="amount-keypad" id="inv-keypad" role="group" aria-label="لوحة مفاتيح مبلغ الفاتورة">
            <button type="button" data-amount-key="1" aria-label="١">1</button><button type="button" data-amount-key="2" aria-label="٢">2</button><button type="button" data-amount-key="3" aria-label="٣">3</button>
            <button type="button" data-amount-key="4" aria-label="٤">4</button><button type="button" data-amount-key="5" aria-label="٥">5</button><button type="button" data-amount-key="6" aria-label="٦">6</button>
            <button type="button" data-amount-key="7" aria-label="٧">7</button><button type="button" data-amount-key="8" aria-label="٨">8</button><button type="button" data-amount-key="9" aria-label="٩">9</button>
            <button type="button" class="keypad-delete" data-amount-action="backspace" aria-label="حذف آخر رقم">⌫</button><button type="button" data-amount-key="0" aria-label="٠">0</button><button type="button" data-amount-action="decimal" aria-label="فاصلة عشرية">٫</button>
          </div>
          <label>المشتريات / البيان<textarea id="inv-note" placeholder="مثال: 2 كيس سكر، 1 زيت"></textarea></label>
          <button id="btn-save" class="btn" style="padding:14px;font-size:16px">حفظ الفاتورة</button>
        </div>
      </div>
      <div class="card">
        <h2>إضافة عميل سريع</h2>
        <div class="stack">
          <label>الاسم<input id="c-name"></label>
          <label id="credit-limit-field">حد الائتمان (0 = بلا حد)<input id="c-limit" type="number" min="0" step="any" value="0" inputmode="decimal"></label>
          <button id="btn-add-c" class="btn alt">إضافة العميل</button>
        </div>
      </div>
    </section>


    <!-- ==== شاشة 3: العملاء ==== -->
    <section id="screen-customers" class="screen hidden">
      <div class="card" style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:14px">إجمالي الديون</span>
        <b id="total-debt" style="font-size:18px;color:var(--bad)">0.00</b>
      </div>
      <div class="card">
        <div class="customer-search-head">
          <label for="customer-search">بحث عن عميل</label>
          <button id="customer-sort" class="customer-sort-toggle" type="button" data-mode="number" aria-pressed="false" aria-label="الترتيب الحالي: الرقم التسلسلي. اضغط للتبديل إلى أعلى رصيد دين">
            <span aria-hidden="true">↕</span><span id="customer-sort-label">الرقم</span>
          </button>
        </div>
        <input id="customer-search" type="search" placeholder="ابحث باسم العميل أو رقمه" autocomplete="off" aria-label="بحث عن عميل">
      </div>
      <div class="cust-list stack" id="customers"></div>
    </section>


    <!-- ==== شاشة 4: ملف العميل ==== -->
    <section id="screen-customer" class="screen hidden">
      <div class="profile-head" id="profile-head"></div>
      <div class="card">
        <h2>كشف الحركات</h2>
        <div class="tx-list" id="customer-tx"></div>
      </div>
    </section>


    <!-- ==== شاشة 5: المستخدمون ==== -->
    <section id="screen-users" class="screen hidden">
      <div class="card">
        <h2 id="user-form-title">إضافة مستخدم</h2>
        <div class="stack">
          <label>اسم المستخدم<input id="u-username" autocomplete="off"></label>
          <label>الاسم الظاهر<input id="u-name"></label>
          <label>الدور<select id="u-role"><option value="seller">بائع</option><option value="admin">مدير</option></select></label>
          <label>كلمة المرور<input id="u-password" type="password" autocomplete="new-password" placeholder="6 أحرف على الأقل"></label>
          <button id="btn-save-user" class="btn">إضافة المستخدم</button>
          <button id="btn-cancel-user" class="btn alt hidden">إلغاء التعديل</button>
        </div>
      </div>
      <div class="card">
        <h2>المستخدمون</h2>
        <div class="tx-list" id="users"></div>
      </div>
    </section>
  </main>


  <nav id="bottom-nav">
    <button data-screen="stats" class="on"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-8M12 20V5M19 20v-5"/></svg></span>الإحصائيات</button>
    <button data-screen="new"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M12 11v6M9 14h6"/></svg></span>فاتورة</button>
    <button data-screen="customers"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17.5 14.2c2.4.3 4 2.1 4 4.8"/></svg></span>العملاء</button>
    <button data-screen="users" id="nav-users" class="hidden"><span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></svg></span>المستخدمون</button>
  </nav>
</div>


<div id="toast"></div>

<div id="invoice-modal" class="hidden" role="dialog" aria-modal="true">
  <div class="card">
    <div class="modal-head"><h2 id="movement-modal-title">تفاصيل الحركة</h2><button class="btn alt sm" data-close-invoice>إغلاق</button></div>
    <div id="invoice-detail"></div>
  </div>
</div>

<div id="dialog-modal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
  <div class="card">
    <div class="modal-head"><h2 id="dialog-title">تأكيد</h2><button class="btn alt sm" id="dialog-close" type="button">إغلاق</button></div>
    <p id="dialog-msg" class="dialog-msg hidden"></p>
    <form id="dialog-form" class="stack">
      <div id="dialog-fields" class="stack"></div>
      <div class="row2" style="margin-top:4px">
        <button id="dialog-submit" class="btn" type="submit">تأكيد</button>
        <button id="dialog-cancel" class="btn alt" type="button">إلغاء</button>
      </div>
    </form>
  </div>
</div>

<div id="img-modal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="img-modal-title">
  <div class="img-shell">
    <div class="img-toolbar">
      <div class="img-toolbar-head"><strong id="img-modal-title">معاينة الصورة</strong><button class="btn del sm" id="img-close" type="button">إغلاق</button></div>
      <div class="img-actions">
        <button class="btn" id="img-wa" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21l1.6-4.6A9 9 0 1 1 8 19.6z"/><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1.5-1.5-2-1-1 .8c-1-.4-2-1.4-2.4-2.4l.8-1-1-2z"/></svg><span>واتساب</span></button>
        <button class="btn alt" id="img-save" type="button">حفظ الصورة</button>
      </div>
      <p id="img-wa-help" class="hint hidden" aria-live="polite"></p>
    </div>
    <div id="img-list"></div>
  </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
